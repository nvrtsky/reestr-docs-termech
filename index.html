  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 600; font-size: 13.5px;\">Типы документов</div><span style=\"margin-left: auto; font-size: 11.5px; color: #a1a1aa;\">{{ typeTotal }} типов</span><button type=\"button\" onclick=\"{{ openTypeModal }}\" style=\"margin-left: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 7px; padding: 5px 12px; font-size: 11.5px; font-weight: 500; cursor: pointer;\">＋ Тип</button></div>\n              <div>\n                <div style=\"display: grid; grid-template-columns: 170px 1fr 150px 130px; background: #fafafa; color: #a1a1aa; font-size: 10.5px;\">\n                  <div style=\"padding: 7px 15px;\">Раздел</div>\n                  <div style=\"padding: 7px 8px;\">Название</div>\n                  <div style=\"padding: 7px 8px;\">Lifecycle</div>\n                  <div style=\"padding: 7px 15px;\">Контент</div>\n                </div>\n                <sc-for list=\"{{ adminTypeRows }}\" as=\"t\" hint-placeholder-count=\"10\">\n                  <div style=\"display: grid; grid-template-columns: 170px 1fr 150px 130px; border-top: 1px solid #f4f4f5; font-size: 12.5px; align-items: center;\">\n                    <div style=\"padding: 7px 15px;\"><span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #52525b;\"><span style=\"width: 6px; height: 6px; border-radius: 2px; background: {{ t.c }};\"></span>{{ t.section }}</span></div>\n                    <div style=\"padding: 7px 8px; font-weight: 500;\">{{ t.label }}</div>\n                    <div style=\"padding: 7px 8px;\"><code style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #71717a;\">{{ t.lifecycle }}</code></div>\n                    <div style=\"padding: 7px 15px; color: #71717a;\">{{ t.content }}</div>\n                  </div>\n                </sc-for>\n              </div>\n            </div>\n          </sc-if>\n\n          <sc-if value=\"{{ admLifecycles }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 760px;\">\n              <sc-for list=\"{{ adminLifecycles }}\" as=\"lc\" hint-placeholder-count=\"3\">\n                <div style=\"border: 1px solid #ededed; border-radius: 11px; padding: 14px 16px;\">\n                  <div style=\"display: flex; align-items: center; gap: 9px;\"><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 13.5px;\">{{ lc.label }}</div><code style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #a1a1aa;\">{{ lc.code }}</code></div>\n                  <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 11px; flex-wrap: wrap;\">\n                    <sc-for list=\"{{ lc.states }}\" as=\"st\" hint-placeholder-count=\"3\">\n                      <span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 7px; font-size: 11.5px; font-weight: 500; color: {{ st.c }}; background: {{ st.bg }};\"><span style=\"width: 5px; height: 5px; border-radius: 50%; background: {{ st.c }};\"></span>{{ st.label }}</span>\n                      <span style=\"color: #d4d4d8;\">{{ st.arrow }}</span>\n                    </sc-for>\n                  </div>\n                </div>\n              </sc-for>\n            </div>\n          </sc-if>\n\n          <sc-if value=\"{{ admRoles }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"max-width: 760px;\">\n              <div style=\"font-size: 12.5px; color: #71717a; margin-bottom: 12px; line-height: 1.55;\">Политика роли задаёт видимость разделов/типов, скрытые поля и права на действия. Сервер всегда применяет политику авторитетно; интерфейс получает её через <code style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; background: #f4f4f5; padding: 1px 5px; border-radius: 4px;\">GET /me/policy</code>.</div>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n                <sc-for list=\"{{ adminRoleRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <div style=\"border: 1px solid #ededed; border-radius: 10px; padding: 13px 15px;\">\n                    <div style=\"display: flex; align-items: center; gap: 8px;\"><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 13px;\">{{ r.label }}</div><code style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #a1a1aa;\">{{ r.code }}</code></div>\n                    <div style=\"font-size: 11.5px; color: #52525b; margin-top: 6px; line-height: 1.5;\">{{ r.summary }}</div>\n                    <div style=\"margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;\">\n                      <span style=\"font-size: 10px; padding: 2px 7px; border-radius: 5px; background: {{ r.moneyBg }}; color: {{ r.moneyC }};\">{{ r.moneyLabel }}</span>\n                      <span style=\"font-size: 10px; padding: 2px 7px; border-radius: 5px; background: #f4f4f5; color: #52525b;\">{{ r.scopeLabel }}</span>\n                    </div>\n                  </div>\n                </sc-for>\n              </div>\n            </div>\n          </sc-if>\n\n          <sc-if value=\"{{ admTraining }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"max-width: 760px;\">\n              <div style=\"font-size: 12.5px; color: #71717a; margin-bottom: 12px; line-height: 1.55;\">Обучающие материалы для пользователей реестра — короткие статьи и видео. Доступны всем ролям из меню помощи; здесь администратор управляет их составом.</div>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n                <sc-for list=\"{{ trainingItems }}\" as=\"t\" hint-placeholder-count=\"6\">\n                  <div style=\"border: 1px solid #ededed; border-radius: 10px; padding: 13px 15px; display: flex; gap: 11px;\">\n                    <div style=\"width: 32px; height: 32px; border-radius: 8px; background: #eef2ff; color: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none;\">{{ t.icon }}</div>\n                    <div style=\"min-width: 0;\">\n                      <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 13px;\">{{ t.title }}</div>\n                      <div style=\"font-size: 11.5px; color: #52525b; margin-top: 3px; line-height: 1.5;\">{{ t.desc }}</div>\n                      <div style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #a1a1aa; margin-top: 6px;\">{{ t.kind }}</div>\n                    </div>\n                  </div>\n                </sc-for>\n              </div>\n              <button type=\"button\" style=\"margin-top: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 7px; padding: 6px 13px; font-size: 11.5px; font-weight: 500; cursor: pointer;\">＋ Материал</button>\n            </div>\n          </sc-if>\n        </div>\n      </div>\n      </sc-if>\n    </div>\n    </sc-if>\n\n  </main>\n\n  <!-- ░░ DOCUMENT DRAWER ░░ -->\n  <sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 40;\">\n    <div onclick=\"{{ closeDoc }}\" style=\"position: absolute; inset: 0; background: rgba(24,24,27,.32); animation: dcFade .12s;\"></div>\n    <div style=\"position: absolute; top: 0; right: 0; height: 100%; width: min(570px, 96vw); background: #fff; box-shadow: -8px 0 30px rgba(0,0,0,.12); display: flex; flex-direction: column; animation: dcSlideIn .18s ease;\">\n      <div style=\"padding: 15px 20px 13px; border-bottom: 1px solid #ededed;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 10px;\">\n          <div style=\"flex: 1;\">\n            <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: {{ doc.sectionC }};\"><span style=\"width: 6px; height: 6px; border-radius: 2px; background: {{ doc.sectionC }};\"></span>{{ doc.sectionLabel }} · {{ doc.typeLabel }}</span>\n            <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 17px; margin-top: 8px; line-height: 1.25;\">{{ doc.title }}</div>\n            <div style=\"font-family: 'IBM Plex Mono'; font-size: 11px; color: #a1a1aa; margin-top: 2px;\">{{ doc.num }}</div>\n          </div>\n          <button type=\"button\" onclick=\"{{ closeDoc }}\" style=\"background: none; border: none; font-size: 18px; color: #a1a1aa; cursor: pointer; line-height: 1;\">✕</button>\n        </div>\n        <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 12px;\">\n          <span style=\"font-size: 11.5px; color: #a1a1aa;\">Статус:</span>\n          <sc-for list=\"{{ statusOptions }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <button type=\"button\" onclick=\"{{ st.onSet }}\" style=\"{{ st.style }}\">{{ st.label }}</button>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"flex: 1; overflow-y: auto; padding: 16px 20px;\">\n        <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 11.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;\">Реквизиты</div>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #ededed; border: 1px solid #ededed; border-radius: 9px; overflow: hidden; margin-bottom: 18px;\">\n          <div style=\"background: #fff; padding: 9px 12px;\"><div style=\"font-size: 10.5px; color: #a1a1aa;\">Номер</div><div style=\"font-family: 'IBM Plex Mono'; font-size: 12.5px; margin-top: 2px;\">{{ doc.number }}</div></div>\n          <div style=\"background: #fff; padding: 9px 12px;\"><div style=\"font-size: 10.5px; color: #a1a1aa;\">Дата документа</div><div style=\"font-family: 'IBM Plex Mono'; font-size: 12.5px; margin-top: 2px;\">{{ doc.docDate }}</div></div>\n          <div style=\"background: #fff; padding: 9px 12px;\"><div style=\"font-size: 10.5px; color: #a1a1aa;\">Сумма</div><div style=\"font-family: 'IBM Plex Mono'; font-size: 12.5px; margin-top: 2px;\">{{ doc.amountStr }}</div></div>\n          <div style=\"background: #fff; padding: 9px 12px;\"><div style=\"font-size: 10.5px; color: #a1a1aa;\">Компания-контрагент · Bitrix24</div><div style=\"font-size: 12.5px; margin-top: 2px;\">{{ doc.counterparty }}</div></div>\n          <div style=\"background: #fff; padding: 9px 12px; grid-column: span 2;\"><div style=\"font-size: 10.5px; color: #a1a1aa;\">Ответственный</div><div style=\"font-size: 12.5px; margin-top: 2px;\">{{ doc.responsible }}</div></div>\n        </div>\n\n        <div style=\"padding: 11px 12px; margin-bottom: 18px; border: 1px solid #ddd6fe; border-radius: 9px; background: #faf5ff;\">\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\n            <span style=\"color: #7c3aed; font-size: 10px; font-weight: 700;\">[v2]</span>\n            <div style=\"font-size: 11px; color: #6b21a8; font-weight: 600;\">Внутренняя ссылка на документ</div>\n            <div style=\"flex: 1;\"></div>\n            <button type=\"button\" onclick=\"{{ copyInternalLink }}\" style=\"background: #7c3aed; color: #fff; border: none; border-radius: 7px; padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer;\">{{ doc.copyLabel }}</button>\n          </div>\n          <div style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #52525b; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ doc.internalUrl }}</div>\n          <div style=\"font-size: 10.5px; color: #71717a; margin-top: 5px;\">Ссылка непубличная: получателю потребуется авторизация в Bitrix24. Её можно скопировать и отправить вручную.</div>\n        </div>\n\n        <sc-if value=\"{{ doc.hasRelationships }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom: 18px; padding: 11px 12px; border: 1px solid #ddd6fe; border-radius: 9px; background: #faf5ff;\">\n            <div style=\"display: flex; align-items: center; gap: 7px; margin-bottom: 4px;\"><span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span><div style=\"font-family: 'Space Grotesk'; font-weight: 650; font-size: 11.5px; color: #6b21a8;\">{{ doc.relationshipHeading }}</div></div>\n            <div style=\"font-size: 10.5px; color: #71717a; margin-bottom: 7px;\">{{ doc.relationshipHint }}</div>\n            <sc-for list=\"{{ doc.relationshipItems }}\" as=\"rel\" hint-placeholder-count=\"2\">\n              <button type=\"button\" onclick=\"{{ rel.onOpen }}\" style=\"width: 100%; display: grid; grid-template-columns: 104px 1fr auto; gap: 8px; align-items: center; padding: 8px 9px; margin-top: 5px; background: #fff; border: 1px solid #ede9fe; border-radius: 8px; cursor: pointer; text-align: left;\">\n                <span style=\"font-size: 9.5px; color: #7c3aed; font-weight: 700;\">{{ rel.relation }}</span>\n                <span style=\"font-size: 11.5px; color: #3f3f46; font-weight: 550;\">{{ rel.title }}</span>\n                <span style=\"font-family: 'IBM Plex Mono'; font-size: 9.5px; color: #a1a1aa;\">{{ rel.num }}</span>\n              </button>\n            </sc-for>\n          </div>\n        </sc-if>\n\n        <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 11.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;\"><span style=\"color: #7c3aed;\">[v2]</span> Файл или ссылка · {{ doc.attCount }}</div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;\">\n          <sc-for list=\"{{ doc.attachments }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <div style=\"display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid #ededed; border-radius: 8px; background: #fafafa;\">\n              <span style=\"font-size: 15px;\">{{ a.icon }}</span>\n              <div style=\"flex: 1; min-width: 0;\">\n                <div style=\"font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ a.name }}</div>\n                <div style=\"font-size: 10.5px; color: #a1a1aa;\">{{ a.meta }}</div>\n              </div>\n              <span style=\"color: #c4c4c8; font-size: 13px;\">{{ a.actions }}</span>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"display: flex; gap: 8px; margin-bottom: 18px;\">\n          <button type=\"button\" style=\"flex: 1; background: #fff; border: 1px dashed #d4d4d8; border-radius: 8px; padding: 8px; font-size: 11.5px; color: #52525b; cursor: pointer;\">＋ Файл</button>\n          <button type=\"button\" style=\"flex: 1; background: #fff; border: 1px dashed #d4d4d8; border-radius: 8px; padding: 8px; font-size: 11.5px; color: #52525b; cursor: pointer;\">🔗 Ссылка</button>\n        </div>\n\n        <div style=\"display: flex; align-items: center; gap: 7px; margin-bottom: 8px;\">\n          <span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span>\n          <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 11.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px;\">История версий · {{ doc.versionCount }}</div>\n          <div style=\"flex: 1;\"></div>\n          <button type=\"button\" onclick=\"{{ doc.onReplaceFile }}\" style=\"background: #7c3aed; color: #fff; border: none; border-radius: 7px; padding: 5px 9px; font-size: 10.5px; font-weight: 650; cursor: pointer;\">Заменить файл → новая версия</button>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px;\">\n          <sc-for list=\"{{ doc.versions }}\" as=\"ver\" hint-placeholder-count=\"3\">\n            <div style=\"{{ ver.style }}\">\n              <span style=\"{{ ver.badgeStyle }}\">{{ ver.number }}</span>\n              <div><div style=\"font-size: 11px; font-weight: 550; color: #3f3f46;\">{{ ver.name }}</div><div style=\"font-size: 9.5px; color: #a1a1aa; margin-top: 2px;\">{{ ver.date }} · {{ ver.author }}</div></div>\n              <span style=\"{{ ver.currentStyle }}\">{{ ver.currentLabel }}</span>\n            </div>\n          </sc-for>\n        </div>\n        <sc-if value=\"{{ doc.versionNotice }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-bottom: 16px; padding: 7px 9px; border-radius: 7px; background: #e7f5ec; color: #15803d; font-size: 10.5px;\">{{ doc.versionNotice }}</div></sc-if>\n\n        <div style=\"display: flex; align-items: center; gap: 7px; margin: 16px 0 8px;\">\n          <span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span>\n          <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 11.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px;\">Физические копии Bitrix Disk · {{ doc.physicalCopyCount }}</div>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px;\">\n          <sc-for list=\"{{ doc.physicalCopies }}\" as=\"copy\" hint-placeholder-count=\"2\">\n            <div style=\"padding: 8px 9px; border: 1px solid #ededed; border-radius: 8px; background: #fafafa;\">\n              <div style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"font-size: 10px; font-weight: 700; color: #4f46e5;\">Сделка {{ copy.deal }}</span><span style=\"font-family: 'IBM Plex Mono'; font-size: 9.5px; color: #7c3aed;\">{{ copy.version }}</span><span style=\"margin-left: auto; font-size: 9.5px; color: #15803d;\">✓ {{ copy.state }}</span></div>\n              <div style=\"font-family: 'IBM Plex Mono'; font-size: 9.5px; color: #71717a; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ copy.path }}</div>\n            </div>\n          </sc-for>\n        </div>\n\n        <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 11.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;\">Привязки · {{ doc.linkCount }}</div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;\">\n          <sc-for list=\"{{ doc.links }}\" as=\"l\" hint-placeholder-count=\"2\">\n            <div style=\"display: flex; align-items: center; gap: 9px; padding: 8px 11px; border: 1px solid #ededed; border-radius: 8px;\">\n              <span style=\"font-size: 11px; padding: 1px 7px; border-radius: 4px; background: #f4f4f5; color: #52525b; font-weight: 500;\">{{ l.type }}</span>\n              <span style=\"font-size: 12px;\">{{ l.title }}</span>\n            </div>\n          </sc-for>\n        </div>\n        <button type=\"button\" style=\"background: none; border: none; color: #4f46e5; font-size: 11.5px; font-weight: 500; cursor: pointer; padding: 0;\">＋ Привязать к сущности Bitrix24</button>\n\n        <div style=\"margin: 18px 0 0; padding: 11px 12px; border: 1px solid #ddd6fe; border-radius: 9px; background: #faf5ff;\">\n          <div style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span><div style=\"font-family: 'Space Grotesk'; font-weight: 650; font-size: 11.5px; color: #6b21a8;\">Доступ после закрытия сделок</div></div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 7px;\"><sc-for list=\"{{ doc.dealAccessRows }}\" as=\"deal\" hint-placeholder-count=\"2\"><span style=\"{{ deal.style }}\">{{ deal.deal }} · {{ deal.state }}</span></sc-for></div>\n          <div style=\"font-size: 10.5px; color: #52525b; margin-bottom: 7px;\">{{ doc.allDealsLabel }}</div>\n          <div style=\"display: flex; flex-direction: column; gap: 4px;\"><sc-for list=\"{{ doc.accessRows }}\" as=\"access\" hint-placeholder-count=\"3\"><div style=\"{{ access.style }}\"><span style=\"font-weight: 650;\">{{ access.role }}</span><span style=\"margin-left: auto;\">{{ access.access }}</span></div></sc-for></div>\n          <button type=\"button\" onclick=\"{{ doc.onToggleClosedDeals }}\" style=\"margin-top: 8px; width: 100%; background: #fff; color: #7c3aed; border: 1px solid #c4b5fd; border-radius: 7px; padding: 6px 9px; font-size: 10.5px; font-weight: 650; cursor: pointer;\">{{ doc.closeDealsLabel }}</button>\n        </div>\n\n        <div style=\"margin: 12px 0 0; padding: 11px 12px; border: 1px solid #fecaca; border-radius: 9px; background: #fffafa;\">\n          <div style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span><div style=\"font-family: 'Space Grotesk'; font-weight: 650; font-size: 11.5px; color: #7f1d1d;\">Архивирование без удаления</div></div>\n          <div style=\"font-size: 10.5px; color: #71717a; margin: 6px 0;\">{{ doc.archiveStateLabel }}</div>\n          <div style=\"font-size: 10px; color: #52525b;\">Получатели уведомления: <sc-for list=\"{{ doc.archiveRecipients }}\" as=\"recipient\" hint-placeholder-count=\"2\"><span style=\"display: inline-block; margin: 3px 3px 0 0; padding: 2px 6px; border-radius: 999px; background: #f4f4f5;\">{{ recipient.name }}</span></sc-for></div>\n          <button type=\"button\" onclick=\"{{ doc.onToggleArchive }}\" style=\"margin-top: 8px; background: #fff; color: #b91c1c; border: 1px solid #fecaca; border-radius: 7px; padding: 6px 10px; font-size: 10.5px; font-weight: 650; cursor: pointer;\">{{ doc.archiveActionLabel }}</button>\n          <sc-if value=\"{{ doc.archiveNotice }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top: 7px; padding: 6px 8px; border-radius: 7px; background: #e7f5ec; color: #15803d; font-size: 10px;\">{{ doc.archiveNotice }}</div></sc-if>\n        </div>\n\n        <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 11.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px;\">История</div>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <sc-for list=\"{{ doc.history }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 9px; align-items: flex-start;\">\n              <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #d4d4d8; margin-top: 5px;\"></span>\n              <div style=\"font-size: 11.5px; color: #52525b; line-height: 1.4;\"><span style=\"color: #18181b;\">{{ h.what }}</span> · {{ h.who }} · <span style=\"font-family: 'IBM Plex Mono'; color: #a1a1aa;\">{{ h.when }}</span></div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </div>\n  </div>\n  </sc-if>\n\n  <sc-if value=\"{{ drawerDenied }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 58; display: flex; align-items: center; justify-content: center; padding: 20px;\">\n    <div style=\"position: absolute; inset: 0; background: rgba(24,24,27,.5);\"></div>\n    <div style=\"position: relative; width: min(450px, 94vw); background: #fff; border-radius: 14px; box-shadow: 0 22px 70px rgba(0,0,0,.3); padding: 22px;\">\n      <div style=\"display: flex; align-items: flex-start; gap: 12px;\"><div style=\"width: 38px; height: 38px; border-radius: 10px; background: #fdeaea; color: #dc2626; display: flex; align-items: center; justify-content: center; font-size: 19px;\">⊘</div><div style=\"flex: 1;\"><div style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span><div style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 17px;\">Доступ прекращён</div></div><div style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #a1a1aa; margin-top: 3px;\">{{ deniedDocumentNumber }}</div></div><button type=\"button\" onclick=\"{{ closeDenied }}\" style=\"background: none; border: none; color: #a1a1aa; font-size: 18px; cursor: pointer;\">✕</button></div>\n      <div style=\"margin-top: 14px; padding: 12px 13px; border-radius: 9px; background: #fff7ed; color: #7c2d12; font-size: 12px; line-height: 1.55;\">Все связанные сделки документа закрыты. Для роли «Менеджер продаж» недоступны карточка, просмотр файла и скачивание. Ссылка также не обходит это правило.</div>\n      <div style=\"margin-top: 10px; font-size: 11px; color: #71717a;\">Бухгалтер и администратор сохраняют действия, разрешённые политикой типа документа.</div>\n      <div style=\"display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;\"><button type=\"button\" onclick=\"{{ closeDenied }}\" style=\"background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 8px 12px; color: #52525b; font-size: 11.5px; cursor: pointer;\">Закрыть</button><button type=\"button\" onclick=\"{{ continueAsAccounting }}\" style=\"background: #4f46e5; border: none; border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 11.5px; font-weight: 650; cursor: pointer;\">Проверить как бухгалтер</button></div>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ░░ BULK UPLOAD V2 ░░ -->\n  <sc-if value=\"{{ bulkOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 52; display: flex; align-items: center; justify-content: center; padding: 18px;\">\n    <div onclick=\"{{ closeBulk }}\" style=\"position: absolute; inset: 0; background: rgba(24,24,27,.46); animation: dcFade .12s;\"></div>\n    <div style=\"position: relative; width: min(1180px, 96vw); max-height: 92vh; background: #fff; border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; animation: dcFade .18s; overflow: hidden;\">\n      <div style=\"padding: 15px 20px; border-bottom: 1px solid #ededed; display: flex; align-items: center; gap: 11px;\">\n        <span style=\"padding: 3px 8px; border-radius: 999px; background: #ede9fe; color: #7c3aed; font-size: 10px; font-weight: 800;\">[v2]</span>\n        <div>\n          <div style=\"font-family: 'Space Grotesk'; font-weight: 650; font-size: 17px;\">Массовая загрузка документов</div>\n          <div style=\"font-size: 11.5px; color: #71717a; margin-top: 2px;\">{{ bulkContextLabel }} · отдельные реквизиты и связи для каждого файла</div>\n        </div>\n        <div style=\"flex: 1;\"></div>\n        <span style=\"font-family: 'IBM Plex Mono'; font-size: 11px; color: #7c3aed;\">{{ bulkCountLabel }}</span>\n        <button type=\"button\" onclick=\"{{ closeBulk }}\" style=\"background: none; border: none; font-size: 19px; color: #a1a1aa; cursor: pointer;\">✕</button>\n      </div>\n\n      <div style=\"padding: 12px 18px; border-bottom: 1px solid #ededed; background: #fafafa;\">\n        <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n          <div style=\"font-size: 11px; font-weight: 650; color: #52525b;\">Общие значения</div>\n          <span style=\"font-size: 10.5px; color: #a1a1aa;\">заполните нужные поля и примените ко всем строкам; после этого строку можно изменить отдельно</span>\n        </div>\n        <div style=\"display: grid; grid-template-columns: 1.25fr .9fr 1.2fr 1.05fr 1.35fr auto; gap: 8px; align-items: end;\">\n          <label style=\"display: block;\"><span style=\"font-size: 10px; color: #a1a1aa;\">Тип</span><select value=\"{{ bulkCommonType }}\" onchange=\"{{ setBulkCommonType }}\" style=\"width: 100%; margin-top: 3px; padding: 7px 8px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 11.5px;\"><option value=\"\">Не менять</option><sc-for list=\"{{ bulkTypeOptions }}\" as=\"o\" hint-placeholder-count=\"8\"><option value=\"{{ o }}\">{{ o }}</option></sc-for></select></label>\n          <label style=\"display: block;\"><span style=\"font-size: 10px; color: #a1a1aa;\">Дата</span><input value=\"{{ bulkCommonDate }}\" oninput=\"{{ setBulkCommonDate }}\" placeholder=\"дд.мм.гггг\" style=\"width: 100%; margin-top: 3px; padding: 7px 8px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 11.5px;\"></label>\n          <label style=\"display: block;\"><span style=\"font-size: 10px; color: #a1a1aa;\">Компания-контрагент</span><input value=\"{{ bulkCommonCounterparty }}\" oninput=\"{{ setBulkCommonCounterparty }}\" placeholder=\"Компания Bitrix24\" style=\"width: 100%; margin-top: 3px; padding: 7px 8px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 11.5px;\"></label>\n          <label style=\"display: block;\"><span style=\"font-size: 10px; color: #a1a1aa;\">Ответственный</span><select value=\"{{ bulkCommonResponsible }}\" onchange=\"{{ setBulkCommonResponsible }}\" style=\"width: 100%; margin-top: 3px; padding: 7px 8px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 11.5px;\"><option value=\"\">Не менять</option><sc-for list=\"{{ responsibleOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}</option></sc-for></select></label>\n          <label style=\"display: block;\"><span style=\"font-size: 10px; color: #7c3aed;\"><b>[v2]</b> Задача Bitrix24</span><select value=\"{{ bulkCommonTask }}\" onchange=\"{{ setBulkCommonTask }}\" style=\"width: 100%; margin-top: 3px; padding: 7px 8px; border: 1px solid #ddd6fe; border-radius: 7px; font-size: 11.5px;\"><option value=\"\">Не менять</option><sc-for list=\"{{ taskOptions }}\" as=\"task\" hint-placeholder-count=\"3\"><option value=\"{{ task.id }}\">{{ task.label }}</option></sc-for></select></label>\n          <button type=\"button\" onclick=\"{{ applyBulkCommon }}\" style=\"background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 11.5px; font-weight: 650; cursor: pointer; white-space: nowrap;\">Применить ко всем</button>\n        </div>\n      </div>\n\n      <div style=\"padding: 11px 18px; border-bottom: 1px solid #ededed;\">\n        <div id=\"bulk-drop-zone-v2\" style=\"display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1.5px dashed #c4b5fd; border-radius: 10px; background: #faf5ff;\">\n          <div style=\"width: 34px; height: 34px; border-radius: 9px; background: #ede9fe; color: #7c3aed; display: flex; align-items: center; justify-content: center; font-size: 18px;\">⇧</div>\n          <div>\n            <div style=\"font-size: 12px; font-weight: 650; color: #4c1d95;\">Перетащите несколько файлов сюда</div>\n            <div style=\"font-size: 10.5px; color: #7c3aed; margin-top: 2px;\">Каждый файл станет отдельной редактируемой строкой. Тип по имени файла не распознаётся автоматически.</div>\n          </div>\n          <div style=\"flex: 1;\"></div>\n          <label style=\"background: #fff; border: 1px solid #ddd6fe; border-radius: 8px; padding: 7px 11px; color: #6d28d9; font-size: 11.5px; font-weight: 600; cursor: pointer;\">Выбрать файлы<input type=\"file\" multiple onchange=\"{{ bulkPickFiles }}\" style=\"display: none;\"></label>\n          <button type=\"button\" onclick=\"{{ addBulkDemoFiles }}\" style=\"background: none; border: none; color: #7c3aed; font-size: 10.5px; cursor: pointer; text-decoration: underline;\">Добавить 2 демо-файла</button>\n        </div>\n      </div>\n\n      <div style=\"flex: 1; overflow: auto; padding: 0 18px 12px;\">\n        <sc-if value=\"{{ bulkIsEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding: 42px 20px; text-align: center; color: #a1a1aa;\">\n            <div style=\"font-size: 25px;\">⇧</div>\n            <div style=\"font-size: 12.5px; margin-top: 8px;\">Добавьте не менее двух файлов для массового сценария.</div>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ bulkHasRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-width: 1090px;\">\n            <div style=\"display: grid; grid-template-columns: 220px 165px 185px 180px 180px 1fr 28px; gap: 8px; padding: 9px 7px 6px; color: #a1a1aa; font-size: 10px; text-transform: uppercase; letter-spacing: .35px;\">\n              <div>Файл и название</div><div>Тип и поле типа</div><div>Дата, сумма, валюта</div><div>Компания и ответственный</div><div>Задача Bitrix24</div><div>Сделки</div><div></div>\n            </div>\n ound: none; border: 1px solid #e4e4e7; border-radius: 8px; padding: 9px 16px; font-size: 12.5px; color: #52525b; cursor: pointer;\">Отмена</button>\n        <button type=\"button\" onclick=\"{{ wzPrimary }}\" style=\"{{ wzPrimaryStyle }}\">{{ wzPrimaryLabel }}</button>\n      </div>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ░░ TYPE CONSTRUCTOR MODAL ░░ -->\n  <sc-if value=\"{{ typeModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 55; display: flex; align-items: center; justify-content: center;\">\n    <div onclick=\"{{ closeTypeModal }}\" style=\"position: absolute; inset: 0; background: rgba(24,24,27,.4); animation: dcFade .12s;\"></div>\n    <div style=\"position: relative; width: 640px; max-height: 88vh; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; animation: dcFade .18s; overflow: hidden;\">\n      <div style=\"padding: 16px 22px; border-bottom: 1px solid #ededed; display: flex; align-items: center; gap: 12px;\">\n        <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 16px;\">Новый тип документа</div>\n        <div style=\"flex: 1;\"></div>\n        <button type=\"button\" onclick=\"{{ closeTypeModal }}\" style=\"background: none; border: none; font-size: 18px; color: #a1a1aa; cursor: pointer;\">✕</button>\n      </div>\n      <div style=\"flex: 1; overflow-y: auto; padding: 20px 22px;\">\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px;\">\n          <label style=\"display: block;\"><span style=\"font-size: 11px; color: #a1a1aa;\">Раздел</span>\n            <select value=\"{{ ntSection }}\" onchange=\"{{ ntSetSection }}\" style=\"width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 12.5px;\">\n              <sc-for list=\"{{ ntSectionOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.code }}\">{{ o.label
