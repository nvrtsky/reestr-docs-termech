style=\"background:#fdf2e3; color:#d97706; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Заявка на перевозку</span><span style=\"background:#fdf2e3; color:#d97706; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Транспортный документ</span><span style=\"background:#fdf2e3; color:#d97706; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Страховой документ</span></div></div><div style=\"border:1px solid #ededed; border-radius:11px; overflow:hidden;\"><div style=\"padding:11px 15px; border-left:4px solid #dc2626;\"><div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14px; color:#dc2626;\">Таможня</span><span style=\"font-family:'IBM Plex Mono'; font-size:10.5px; color:#a1a1aa;\">4 тип.</span></div><div style=\"font-size:11.5px; color:#a1a1aa; margin-top:2px;\">Таможенное оформление и разрешения</div></div><div style=\"padding:0 15px 13px; display:flex; flex-wrap:wrap; gap:6px;\"><span style=\"background:#fdeaea; color:#dc2626; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Декларация</span><span style=\"background:#fdeaea; color:#dc2626; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Сертификат</span><span style=\"background:#fdeaea; color:#dc2626; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Разрешительный документ</span><span style=\"background:#fdeaea; color:#dc2626; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Брокерский документ</span></div></div><div style=\"border:1px solid #ededed; border-radius:11px; overflow:hidden;\"><div style=\"padding:11px 15px; border-left:4px solid #7c3aed;\"><div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14px; color:#7c3aed;\">Юридические</span><span style=\"font-family:'IBM Plex Mono'; font-size:10.5px; color:#a1a1aa;\">5 тип.</span></div><div style=\"font-size:11.5px; color:#a1a1aa; margin-top:2px;\">Доверенности, претензии, переписка</div></div><div style=\"padding:0 15px 13px; display:flex; flex-wrap:wrap; gap:6px;\"><span style=\"background:#f2ecfd; color:#7c3aed; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Доверенность</span><span style=\"background:#f2ecfd; color:#7c3aed; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Претензия</span><span style=\"background:#f2ecfd; color:#7c3aed; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Ответ</span><span style=\"background:#f2ecfd; color:#7c3aed; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Письмо</span><span style=\"background:#f2ecfd; color:#7c3aed; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Юр. заключение</span></div></div><div style=\"border:1px solid #ededed; border-radius:11px; overflow:hidden;\"><div style=\"padding:11px 15px; border-left:4px solid #64748b;\"><div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14px; color:#64748b;\">Внутренние</span><span style=\"font-family:'IBM Plex Mono'; font-size:10.5px; color:#a1a1aa;\">4 тип.</span></div><div style=\"font-size:11.5px; color:#a1a1aa; margin-top:2px;\">Внутренние согласования и контроль</div></div><div style=\"padding:0 15px 13px; display:flex; flex-wrap:wrap; gap:6px;\"><span style=\"background:#eef1f5; color:#64748b; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Служебная записка</span><span style=\"background:#eef1f5; color:#64748b; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Внутреннее согласование</span><span style=\"background:#eef1f5; color:#64748b; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Чек-лист</span><span style=\"background:#eef1f5; color:#64748b; border-radius:20px; padding:3px 11px; font-size:11.5px; font-weight:500;\">Протокол</span></div></div>\n        </div>\n      </div>\n      <!-- 6b fields -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">6.1 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 14px; letter-spacing: -.5px;\">Поля типа документа</h2>\n        <p style=\"font-size: 14px; line-height: 1.65; color: #3f3f46; margin: 0 0 14px;\">Кроме общего ядра реквизитов (номер, дата, сумма, валюта, компания-контрагент, ответственный, статус) у каждого <b>типа</b> может быть свой набор дополнительных полей. Они задаются администратором в конструкторе типа и автоматически появляются в мастере создания и в карточке документа этого типа.</p>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px;\">\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Конструктор полей на типе.</b> Администрирование → Типы документов → «＋ Тип» / редактирование: добавить поле с названием, типом данных (Текст, Число, Дата, Сумма, Список, Да/Нет, Файл) и флагом обязательности.</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Библиотека полей.</b> Общие поля (Срок оплаты, Ставка НДС, Базис поставки, № ГТД…) определяются один раз и переиспользуются между типами — без дублирования и с единым форматом.</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Динамика в мастере.</b> На шаге «Реквизиты» под выбранный тип подгружаются его поля; обязательные проверяются перед созданием.</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Хранение и поиск.</b> Значения хранятся per-документ (<code style=\"font-family:'IBM Plex Mono'; font-size:11.5px; background:#f4f4f5; padding:1px 5px; border-radius:4px;\">registry_document_field_values</code>) и доступны для фильтров и выгрузки.</div>\n        </div>\n        <div style=\"padding: 13px 15px; background: #eff4ff; border-left: 3px solid #2563eb; border-radius: 6px; font-size: 13px; line-height: 1.55; color: #1e3a5f;\">Модель данных: <code style=\"font-family:'IBM Plex Mono'; font-size:11.5px;\">registry_field_definitions</code> (библиотека) · <code style=\"font-family:'IBM Plex Mono'; font-size:11.5px;\">registry_type_fields</code> (привязка к типу: порядок, обязательность) · <code style=\"font-family:'IBM Plex Mono'; font-size:11.5px;\">registry_document_field_values</code> (значения). Изменение состава полей не требует участия разработчика.</div>\n      </div>\n\n      <!-- 7 lifecycle -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">7 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Жизненный цикл и статусы</h2>\n        <p style=\"font-size: 14px; line-height: 1.65; color: #3f3f46; margin: 0 0 14px;\">Каждый тип документа использует один из шаблонов жизненного цикла. Разрешены только переходы, заданные шаблоном; недопустимые переходы блокируются.</p>\n        <table style=\"width:100%; border-collapse:collapse; font-size:12.5px;\">\n          <thead><tr style=\"background:#fafafa; text-align:left;\"><th style=\"padding:8px 11px; font-weight:600; border-bottom:1px solid #ededed;\">Статус</th><th style=\"padding:8px 11px; font-weight:600; border-bottom:1px solid #ededed;\">Бизнес-смысл и кто переводит</th></tr></thead>\n          <tbody><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#71717a; background:#f4f4f5;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#71717a;\"></span>Черновик</span></td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Создан, заполняется. Виден ответственному и роли. Переводит: автор.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#b45309; background:#fdf2e3;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#b45309;\"></span>На согласовании</span></td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Отправлен на проверку (юрист / бухгалтер / руководитель).</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#2563eb; background:#eef2ff;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#2563eb;\"></span>Ожидает оплаты</span></td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Для счетов и инвойсов: выставлен, ждёт платежа. Переводит: бухгалтер.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#15803d; background:#e7f5ec;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#15803d;\"></span>Подписан</span></td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Договор / доп. соглашение подписан сторонами. Переводит: юрист / руководитель.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#15803d; background:#e7f5ec;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#15803d;\"></span>Активен</span></td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Документ действует (полис, сертификат, упаковочный лист).</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#dc2626; background:#fdeaea;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#dc2626;\"></span>Просрочен</span></td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Истёк срок действия или оплаты. Может ставиться автоматически.</td></tr><tr><td style=\"padding:9px 11px;  white-space:nowrap;\"><span style=\"display:inline-flex; align-items:center; gap:7px; padding:3px 10px; border-radius:7px; font-weight:500; color:#a1a1aa; background:#f4f4f5;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#a1a1aa;\"></span>В архиве</span></td><td style=\"padding:9px 11px;  color:#3f3f46; line-height:1.5;\">Исполнен или неактуален. Скрыт из рабочих видов.</td></tr></tbody>\n        </table>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 10px;\">Шаблоны жизненного цикла</h3>\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"border:1px solid #ededed; border-radius:10px; padding:12px 15px;\"><div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\"><span style=\"font-family:'Space Grotesk'; font-weight:600; font-size:13.5px;\">Простой</span><code style=\"font-family:'IBM Plex Mono'; font-size:11.5px; background:#f4f4f5; padding:2px 8px; border-radius:5px; color:#52525b;\">draft → active → archived</code></div><div style=\"font-size:12px; color:#a1a1aa; margin-top:5px;\">Применение: Большинство сопроводительных документов</div></div><div style=\"border:1px solid #ededed; border-radius:10px; padding:12px 15px;\"><div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\"><span style=\"font-family:'Space Grotesk'; font-weight:600; font-size:13.5px;\">С согласованием</span><code style=\"font-family:'IBM Plex Mono'; font-size:11.5px; background:#f4f4f5; padding:2px 8px; border-radius:5px; color:#52525b;\">draft → on_review → signed → archived</code></div><div style=\"font-size:12px; color:#a1a1aa; margin-top:5px;\">Применение: Договоры, доп. соглашения</div></div><div style=\"border:1px solid #ededed; border-radius:10px; padding:12px 15px;\"><div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\"><span style=\"font-family:'Space Grotesk'; font-weight:600; font-size:13.5px;\">Финансовый</span><code style=\"font-family:'IBM Plex Mono'; font-size:11.5px; background:#f4f4f5; padding:2px 8px; border-radius:5px; color:#52525b;\">draft → awaiting → active → archived</code></div><div style=\"font-size:12px; color:#a1a1aa; margin-top:5px;\">Применение: Счета, инвойсы, УПД</div></div>\n        </div>\n      </div>\n      <!-- 8 screens -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">8 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Экраны системы</h2>\n        <p style=\"font-size: 14px; line-height: 1.65; color: #3f3f46; margin: 0 0 14px;\"><span style=\"color:#7c3aed;font-weight:700;\">[v2]</span> Ниже сохранены базовые экраны исходной спецификации. Актуальные состояния массовой загрузки, связанных документов и финансового итога размещены в блоке v2.0 выше; кнопки блока открывают интерактивные экраны. Мобильная версия не входит в объём.</p>\n        <figure style=\"margin:0 0 22px;\"><img src=\"c212f48f-e809-41d3-9ac2-7ebbcbd8bb6f\" alt=\"Рис. 1. Полноэкранный реестр.\" style=\"width:100%; display:block; border:1px solid #ededed; border-radius:9px;\"><figcaption style=\"margin-top:8px; font-size:12.5px; color:#52525b; line-height:1.5;\"><b style=\"color:#18181b;\">Рис. 1. Полноэкранный реестр.</b> Плотная таблица всех документов в зоне видимости роли: разделы слева, сохранённые виды (Все / Мои / В работе / Черновики), поиск, фильтры, массовые действия и экспорт XLSX.</figcaption></figure><figure style=\"margin:0 0 22px;\"><img src=\"ed95e9b0-9449-4b11-aa83-779348febde1\" alt=\"Рис. 2. Карточка документа.\" style=\"width:100%; display:block; border:1px solid #ededed; border-radius:9px;\"><figcaption style=\"margin-top:8px; font-size:12.5px; color:#52525b; line-height:1.5;\"><b style=\"color:#18181b;\">Рис. 2. Карточка документа.</b> Боковая панель: реквизиты (номер, дата, сумма, компания-контрагент, ответственный), содержимое (файлы и ссылки), привязки к сущностям Bitrix24, переключатель статуса и история изменений.</figcaption></figure><figure style=\"margin:0 0 22px;\"><img src=\"e5b7fdfc-5dee-484b-8ed5-2c86b7efe350\" alt=\"Рис. 3. Мастер создания документа.\" style=\"width:100%; display:block; border:1px solid #ededed; border-radius:9px;\"><figcaption style=\"margin-top:8px; font-size:12.5px; color:#52525b; line-height:1.5;\"><b style=\"color:#18181b;\">Рис. 3. Мастер создания документа.</b> Три шага: выбор раздела и типа → реквизиты и содержимое → привязки и подтверждение. Прогресс по шагам показан индикатором.</figcaption></figure><figure style=\"margin:0 0 22px;\"><img src=\"e62247cf-1278-4543-8a8c-96b588b0ffb4\" alt=\"Рис. 4. Документы в карточке сделки.\" style=\"width:100%; display:block; border:1px solid #ededed; border-radius:9px;\"><figcaption style=\"margin-top:8px; font-size:12.5px; color:#52525b; line-height:1.5;\"><b style=\"color:#18181b;\">Рис. 4. Документы в карточке сделки.</b> Встроенная вкладка: сводка по документам сделки, группировка по разделам, контекстное добавление. Документы привязаны к сделке и её компании.</figcaption></figure><figure style=\"margin:0 0 22px;\"><img src=\"c7d89c52-0b79-4d0b-9504-aa13217a1053\" alt=\"Рис. 5. Реестр глазами менеджера продаж.\" style=\"width:100%; display:block; border:1px solid #ededed; border-radius:9px;\"><figcaption style=\"margin-top:8px; font-size:12.5px; color:#52525b; line-height:1.5;\"><b style=\"color:#18181b;\">Рис. 5. Реестр глазами менеджера продаж.</b> Тот же реестр под ролью «Менеджер продаж»: видны только клиентские и внутренние разделы, суммы и финансовые поля скрыты (прочерк).</figcaption></figure><figure style=\"margin:0 0 22px;\"><img src=\"c593ca13-7ed1-48aa-9881-ae2efbba95ea\" alt=\"Рис. 6. Администрирование.\" style=\"width:100%; display:block; border:1px solid #ededed; border-radius:9px;\"><figcaption style=\"margin-top:8px; font-size:12.5px; color:#52525b; line-height:1.5;\"><b style=\"color:#18181b;\">Рис. 6. Администрирование.</b> Справочники разделов и типов, шаблоны жизненного цикла статусов и политики ролей. Доступно только роли «Администратор».</figcaption></figure>\n      </div>\n      <!-- 9 scenarios -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">9 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Бизнес-сценарии</h2>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"border:1px solid #ededed; border-radius:11px; padding:15px 17px;\"><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-bottom:9px;\">1 · Менеджер по продажам</div><div style=\"display:grid; grid-template-columns:108px 1fr; gap:5px 12px; font-size:12.5px; line-height:1.5;\"><div style=\"color:#a1a1aa;\">Актёр</div><div style=\"color:#3f3f46;\">Менеджер продаж</div><div style=\"color:#a1a1aa;\">Предусловие</div><div style=\"color:#3f3f46;\">Открыта сделка, заведена компания-контрагент.</div><div style=\"color:#a1a1aa;\">Шаги</div><div style=\"color:#3f3f46;\"><ol style=\"margin:0; padding-left:17px;\"><li style=\"margin-bottom:2px;\">Открывает сделку → вкладка «Документы».</li><li style=\"margin-bottom:2px;\">Нажимает «Добавить документ», выбирает раздел «Клиентские» и тип (Договор / Счёт / Приложение).</li><li style=\"margin-bottom:2px;\">Заполняет реквизиты, прикладывает файл или ссылку.</li><li style=\"margin-bottom:2px;\">Подтверждает — документ автоматически привязывается к сделке и компании.</li></ol></div><div style=\"color:#a1a1aa;\">Результат</div><div style=\"color:#15803d;\">Документ создан, виден в реестре и в карточке сделки; суммы по марже скрыты от роли.</div></div></div><div style=\"border:1px solid #ededed; border-radius:11px; padding:15px 17px;\"><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-bottom:9px;\">2 · Бухгалтер</div><div style=\"display:grid; grid-template-columns:108px 1fr; gap:5px 12px; font-size:12.5px; line-height:1.5;\"><div style=\"color:#a1a1aa;\">Актёр</div><div style=\"color:#3f3f46;\">Бухгалтер</div><div style=\"color:#a1a1aa;\">Предусловие</div><div style=\"color:#3f3f46;\">Есть финансовые документы по сделкам.</div><div style=\"color:#a1a1aa;\">Шаги</div><div style=\"color:#3f3f46;\"><ol style=\"margin:0; padding-left:17px;\"><li style=\"margin-bottom:2px;\">Открывает полноэкранный реестр, применяет сохранённый вид «В работе».</li><li style=\"margin-bottom:2px;\">Видит счета, акты, УПД, инвойсы с суммами.</li><li style=\"margin-bottom:2px;\">Меняет статусы (Ожидает оплаты → Активен).</li><li style=\"margin-bottom:2px;\">Экспортирует XLSX для сверки.</li></ol></div><div style=\"color:#a1a1aa;\">Результат</div><div style=\"color:#15803d;\">Финансовые статусы актуальны, выгрузка для сверки получена.</div></div></div><div style=\"border:1px solid #ededed; border-radius:11px; padding:15px 17px;\"><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-bottom:9px;\">3 · Юрист</div><div style=\"display:grid; grid-template-columns:108px 1fr; gap:5px 12px; font-size:12.5px; line-height:1.5;\"><div style=\"color:#a1a1aa;\">Актёр</div><div style=\"color:#3f3f46;\">Юрист</div><div style=\"color:#a1a1aa;\">Предусловие</div><div style=\"color:#3f3f46;\">Договор приложен к сделке, требует проверки.</div><div style=\"color:#a1a1aa;\">Шаги</div><div style=\"color:#3f3f46;\"><ol style=\"margin:0; padding-left:17px;\"><li style=\"margin-bottom:2px;\">Видит юридический и клиентский блоки.</li><li style=\"margin-bottom:2px;\">Прикладывает версии договора (версионирование вложений).</li><li style=\"margin-bottom:2px;\">Переводит статус в «На согласовании», затем «Подписан».</li><li style=\"margin-bottom:2px;\">Ведёт комментарии и фиксирует историю.</li></ol></div><div style=\"color:#a1a1aa;\">Результат</div><div style=\"color:#15803d;\">Договор подписан, версии и история сохранены.</div></div></div><div style=\"border:1px solid #ededed; border-radius:11px; padding:15px 17px;\"><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-bottom:9px;\">4 · Закупка / логистика</div><div style=\"display:grid; grid-template-columns:108px 1fr; gap:5px 12px; font-size:12.5px; line-height:1.5;\"><div style=\"color:#a1a1aa;\">Актёр</div><div style=\"color:#3f3f46;\">Закупка / логистика</div><div style=\"color:#a1a1aa;\">Предусловие</div><div style=\"color:#3f3f46;\">Открыта сделка по поставке.</div><div style=\"color:#a1a1aa;\">Шаги</div><div style=\"color:#3f3f46;\"><ol style=\"margin:0; padding-left:17px;\"><li style=\"margin-bottom:2px;\">Работает с документами поставщика, логистики и таможни в реестре и карточке сделки.</li><li style=\"margin-bottom:2px;\">Прикладывает инвойсы, упаковочные листы, декларации.</li><li style=\"margin-bottom:2px;\">Привязывает документ к сделке и компании одновременно.</li><li style=\"margin-bottom:2px;\">Отслеживает статусы доставки.</li></ol></div><div style=\"color:#a1a1aa;\">Результат</div><div style=\"color:#15803d;\">Документы поставки структурированы и доступны в сделке и компании.</div></div></div><div style=\"border:1px solid #ededed; border-radius:11px; padding:15px 17px;\"><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-bottom:9px;\">5 · Руководитель</div><div style=\"display:grid; grid-template-columns:108px 1fr; gap:5px 12px; font-size:12.5px; line-height:1.5;\"><div style=\"color:#a1a1aa;\">Актёр</div><div style=\"color:#3f3f46;\">Руководитель</div><div style=\"color:#a1a1aa;\">Предусловие</div><div style=\"color:#3f3f46;\">Нужен контроль состояния по всем сделкам.</div><div style=\"color:#a1a1aa;\">Шаги</div><div style=\"color:#3f3f46;\"><ol style=\"margin:0; padding-left:17px;\"><li style=\"margin-bottom:2px;\">Открывает полный реестр.</li><li style=\"margin-bottom:2px;\">Фильтрует по статусам, ответственным и периоду.</li><li style=\"margin-bottom:2px;\">Видит, где процесс стоит и кто отвечает за следующий шаг.</li></ol></div><div style=\"color:#a1a1aa;\">Результат</div><div style=\"color:#15803d;\">Картина по документам прозрачна, узкие места видны.</div></div></div><div style=\"border:1px solid #ededed; border-radius:11px; padding:15px 17px;\"><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-bottom:9px;\">6 · Администратор</div><div style=\"display:grid; grid-template-columns:108px 1fr; gap:5px 12px; font-size:12.5px; line-height:1.5;\"><div style=\"color:#a1a1aa;\">Актёр</div><div style=\"color:#3f3f46;\">Администратор</div><div style=\"color:#a1a1aa;\">Предусловие</div><div style=\"color:#3f3f46;\">Изменились бизнес-правила или состав документов.</div><div style=\"color:#a1a1aa;\">Шаги</div><div style=\"color:#3f3f46;\"><ol style=\"margin:0; padding-left:17px;\"><li style=\"margin-bottom:2px;\">Открывает раздел «Администрирование».</li><li style=\"margin-bottom:2px;\">Редактирует разделы, типы, шаблоны жизненного цикла.</li><li style=\"margin-bottom:2px;\">Настраивает политики ролей и маппинг отделов Bitrix → роли.</li></ol></div><div style=\"color:#a1a1aa;\">Результат</div><div style=\"color:#15803d;\">Справочники и права обновлены без участия разработчика.</div></div></div>\n        </div>\n      </div>\n      <!-- 10 rules -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">10 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Бизнес-правила</h2>\n        <table style=\"width:100%; border-collapse:collapse; font-size:12.5px;\">\n          <tbody><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-01</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Номер документа уникален в пределах типа и компании-контрагента, если администратор включил такую проверку. Формат настраивается; допускается ручной ввод.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-02</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Обязательные поля: тип, раздел, дата документа, ответственный. Сумма и валюта обязательны для финансовых типов.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-03</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Для ролей с признаком «суммы скрыты» финансовые поля не отображаются и не попадают в экспорт.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-04</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">При создании из карточки документ автоматически привязывается к её сущности и связанным (компания сделки).</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-05</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Документ может быть привязан к нескольким сущностям; одна сущность — ко многим документам.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-06</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Жёсткое удаление запрещено — только soft-delete. Восстановление доступно администратору и руководителю.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-07</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Название контрагента хранится копией (денормализация) и обновляется при переименовании компании в CRM.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-08</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Внешние ссылки принимаются только по https; выполняется проверка и санитизация.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-09</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Замена файла создаёт новую версию вложения; предыдущая версия сохраняется.</td></tr><tr><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-10</td><td style=\"padding:9px 11px; border-bottom:1px solid #f4f4f5; color:#3f3f46; line-height:1.5;\">Допустимы только переходы статусов, заданные шаблоном жизненного цикла типа.</td></tr><tr><td style=\"padding:9px 11px;  font-family:'IBM Plex Mono'; color:#4f46e5; vertical-align:top; white-space:nowrap;\">BR-11</td><td style=\"padding:9px 11px;  color:#3f3f46; line-height:1.5;\">Карточка без содержимого допускается только для типов, где администратор включил режим «Содержимое можно добавить позже».</td></tr></tbody>\n        </table>\n      </div>\n      <!-- 11 notif -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">11 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Уведомления и отчётность</h2>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 10px; margin-top:4px;\">Уведомления</h3>\n        <div style=\"display:flex; flex-direction:column; gap:7px; margin-bottom:6px;\">\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.5; color:#3f3f46;\"><span style=\"color:#4f46e5;\">●</span><span>Назначение пользователя ответственным по документу.</span></div>\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.5; color:#3f3f46;\"><span style=\"color:#4f46e5;\">●</span><span>Смена статуса по документам, где пользователь — ответственный.</span></div>\n        </div>\n        <div style=\"font-size:12.5px; color:#a1a1aa; margin-bottom:6px;\">Канал доставки — системные уведомления Bitrix24.</div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 10px;\">Отчётность и выгрузки</h3>\n        <div style=\"display:flex; flex-direction:column; gap:7px;\">\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.5; color:#3f3f46;\"><span style=\"color:#15803d;\">✓</span><span>Экспорт текущего среза реестра в XLSX (с учётом прав роли).</span></div>\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.5; color:#3f3f46;\"><span style=\"color:#15803d;\">✓</span><span>Сохранённые виды: личные и общие наборы фильтров и колонок.</span></div>\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.5; color:#3f3f46;\"><span style=\"color:#15803d;\">✓</span><span><b>Панель «Фильтр»:</b> статус (мультивыбор), тип документа, ответственный, контрагент (подстрока) и период по дате документа (с / по). На кнопке — счётчик активных условий; применение мгновенное, есть «Сбросить». Фильтр работает поверх зоны видимости роли и быстрого поиска.</span></div>\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.5; color:#3f3f46;\"><span style=\"color:#15803d;\">✓</span><span><b>Управление колонками:</b> показ/скрытие столбцов реестра (раздел, контрагент, статус, сумма, дата, ответственный); таблица перестраивается под видимый набор, колонка «Документ» закреплена. Сумма скрывается и правами роли, и вручную.</span></div>\n        </div>\n\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 6px;\">Журнал истории (карточка документа)</h3>\n        <p style=\"font-size: 13px; line-height: 1.6; color: #3f3f46; margin: 0 0 12px;\">В карточке документа ведётся неизменяемый журнал событий в хронологическом порядке. Каждая запись содержит: <b>тип события</b>, <b>автора</b> (пользователь Bitrix24 или «Система»), <b>дату и время</b> и <b>детали</b> (для изменений — поле и значения «было → стало»). Записи не редактируются и не удаляются.</p>\n        <div style=\"border: 1px solid #ededed; border-radius: 10px; overflow: hidden; font-size: 12.5px;\">\n          <div style=\"display: grid; grid-template-columns: 230px 1fr; background: #fafafa; color: #a1a1aa; font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px;\">\n            <div style=\"padding: 8px 14px;\">Событие</div>\n            <div style=\"padding: 8px 14px;\">Что фиксируется в записи</div>\n          </div>\n          <sc-for list=\"{{ historySpec }}\" as=\"h\" hint-placeholder-count=\"13\">\n            <div style=\"display: grid; grid-template-columns: 230px 1fr; border-top: 1px solid #f4f4f5; align-items: start;\">\n              <div style=\"padding: 9px 14px; font-weight: 500; color: #18181b;\">{{ h.event }}</div>\n              <div style=\"padding: 9px 14px; color: #3f3f46; line-height: 1.5;\">{{ h.detail }}</div>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"margin-top: 12px; padding: 12px 14px; background: #fafafa; border: 1px solid #ededed; border-radius: 9px; font-size: 12px; line-height: 1.55; color: #52525b;\">Источник событий — действия пользователей через API модуля и системные webhook’и Bitrix24 (обновление/удаление связанных сущностей фиксируется автором «Система»). Журнал доступен в карточке документа; экспорт журнала — на усмотрение фазы развития.</div>\n      </div>\n\n      <!-- 4 functional -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">12 · ТЕХНИЧЕСКИЙ УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Функциональные требования</h2>\n        <div style=\"font-size: 12px;\">\n          <div style=\"display: grid; grid-template-columns: 72px 1fr 56px; background: #fafafa; border-bottom: 1px solid #ededed; font-weight: 600;\">\n            <div style=\"padding: 8px 10px;\">ID</div>\n            <div style=\"padding: 8px 10px;\">Требование</div>\n            <div style=\"padding: 8px 10px;\">Приор.</div>\n          </div>\n          <sc-for list=\"{{ frRows }}\" as=\"f\" hint-placeholder-count=\"14\">\n            <div style=\"display: grid; grid-template-columns: 72px 1fr 56px; align-items: start;\">\n              <div style=\"padding: 7px 10px; font-family: 'IBM Plex Mono'; border-bottom: 1px solid #f4f4f5; color: #52525b;\">{{ f.id }}</div>\n              <div style=\"padding: 7px 10px; border-bottom: 1px solid #f4f4f5;\">{{ f.text }}</div>\n              <div style=\"padding: 7px 10px; border-bottom: 1px solid #f4f4f5; font-weight: 600; color: {{ f.pc }};\">{{ f.p }}</div>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"margin-top: 12px; font-size: 11.5px; color: #a1a1aa;\">P0 — обязательно к запуску · P1 — желательно в рамках работ.</div>\n      </div>\n\n      <!-- 5 data model -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">13 · ТЕХНИЧЕСКИЙ УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 14px; letter-spacing: -.5px;\">Модель данных</h2>\n        <p style=\"font-size: 13.5px; line-height: 1.6; color: #3f3f46; margin: 0 0 14px;\">PostgreSQL — источник правды. Все таблицы с префиксом <code style=\"font-family: 'IBM Plex Mono'; background: #f4f4f5; padding: 1px 5px; border-radius: 4px; font-size: 12px;\">registry_*</code>, скоупятся по <code style=\"font-family: 'IBM Plex Mono'; background: #f4f4f5; padding: 1px 5px; border-radius: 4px; font-size: 12px;\">portal_url</code>.</p>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 12.5px;\">\n          <sc-for list=\"{{ dataModel }}\" as=\"m\" hint-placeholder-count=\"8\">\n            <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 11px 14px;\"><span style=\"font-family: 'IBM Plex Mono'; color: #4f46e5; font-weight: 500;\">{{ m.t }}</span> — {{ m.d }}</div>\n          </sc-for>\n        </div>\n      </div>\n\n      <!-- 6 api -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">14 · ТЕХНИЧЕСКИЙ УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 14px; letter-spacing: -.5px;\">API и интеграция Bitrix24</h2>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 4px 0 9px;\">Эндпоинты <span style=\"font-family: 'IBM Plex Mono'; font-weight: 400; font-size: 12px; color: #a1a1aa;\">/api/v1/registry/*</span></h3>\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; line-height: 1.9; color: #3f3f46; background: #fafafa; border: 1px solid #ededed; border-radius: 9px; padding: 13px 16px;\">\n          <div><span style=\"color:#15803d;\">GET</span>&nbsp;&nbsp;/documents · /documents/:id&nbsp;&nbsp;<span style=\"color:#a1a1aa;\">список + карточка</span></div>\n          <div><span style=\"color:#2563eb;\">POST</span>&nbsp;/documents · PUT /documents/:id&nbsp;&nbsp;<span style=\"color:#a1a1aa;\">создание / правка</span></div>\n          <div><span style=\"color:#2563eb;\">POST</span>&nbsp;/documents/:id/transition&nbsp;&nbsp;<span style=\"color:#a1a1aa;\">смена статуса</span></div>\n          <div><span style=\"color:#2563eb;\">POST</span>&nbsp;/documents/:id/attachments/file · /link · /:attId/replace</div>\n          <div><span style=\"color:#2563eb;\">POST</span>&nbsp;/documents/:id/links · <span style=\"color:#dc2626;\">DELETE</span> /links/:linkId</div>\n          <div><span style=\"color:#15803d;\">GET</span>&nbsp;&nbsp;/by-entity&nbsp;&nbsp;<span style=\"color:#a1a1aa;\">документы по сущности (встроенные вкладки)</span></div>\n          <div><span style=\"color:#15803d;\">GET</span>&nbsp;&nbsp;/sections · /types · /lifecycles · /me/policy</div>\n          <div><span style=\"color:#2563eb;\">POST</span>&nbsp;/documents/bulk-export&nbsp;&nbsp;<span style=\"color:#a1a1aa;\">XLSX</span></div>\n        </div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 20px 0 9px;\">Методы Bitrix24 REST</h3>\n        <div style=\"font-size: 13px; line-height: 1.7; color: #3f3f46;\"><code style=\"font-family:'IBM Plex Mono';font-size:12px;\">user.current</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">crm.deal.get / crm.company.get</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">disk.folder.uploadfile / disk.file.get</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">im.notify.system.add</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">placement.bind</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">event.bind</code>.</div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 20px 0 9px;\">Placement’ы</h3>\n        <div style=\"font-size: 13px; line-height: 1.7; color: #3f3f46;\"><code style=\"font-family:'IBM Plex Mono';font-size:12px;\">CRM_DEAL_DETAIL_TAB</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">CRM_COMPANY_DETAIL_TAB</code> · <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">LEFT_MENU</code>. SPA встраивается в iframe, авторизация через BX24 JS SDK.</div>\n        <div style=\"margin-top: 14px; padding: 12px 14px; background: #eff4ff; border-left: 3px solid #2563eb; border-radius: 6px; font-size: 12.5px; line-height: 1.55; color: #1e3a5f;\">Webhook’и <code style=\"font-family:'IBM Plex Mono';font-size:11.5px;\">OnCrmDealUpdate/Delete, OnCrmCompanyUpdate/Delete</code> обновляют денормализованное название и чистят orphan‑привязки при удалении сущности. Сбой синхронизации с Bitrix не прерывает работу модуля.</div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 20px 0 9px;\">Хранение файлов (Bitrix Disk)</h3>\n        <p style=\"font-size: 13px; line-height: 1.6; color: #3f3f46; margin: 0 0 8px;\">Файлы хранятся на <b>Bitrix Disk</b>; в нашей БД — только метаданные. Выделенная папка приложения (её id — в <code style=\"font-family:'IBM Plex Mono';font-size:11.5px;background:#f4f4f5;padding:1px 5px;border-radius:4px;\">registry_settings</code>), внутри автоматически создаётся иерархия по контексту: <b>Компания → Сделка → Раздел</b>.</p>\n        <ul style=\"font-size: 13px; line-height: 1.65; color: #3f3f46; margin: 0 0 4px; padding-left: 20px;\">\n          <li>Загрузка — <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">disk.folder.uploadfile</code>; недостающие подпапки создаются на лету (<code style=\"font-family:'IBM Plex Mono';font-size:12px;\">disk.folder.addsubfolder</code>), id папок кешируются.</li>\n          <li>В <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">registry_attachments</code> храним file_id, folder_id, имя, размер, версию, is_primary, вид (файл / ссылка) — файл в БД не дублируется.</li>\n          <li>Внешние ссылки (https) — вложение без файла, папка не создаётся.</li>\n          <li>Доступ авторитетно проверяет сервер (ролевые политики); папки Disk — для удобного ручного просмотра.</li>\n        </ul>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 20px 0 9px;\">Версионирование и замена</h3>\n        <ul style=\"font-size: 13px; line-height: 1.65; color: #3f3f46; margin: 0 0 10px; padding-left: 20px;\">\n          <li><b>Версия файла (внутри документа).</b> Замена файла создаёт новую версию вложения; прежняя сохраняется. Цепочка версий ведётся в нашей БД (attachment_id, версия, file_id, кто, когда), независимо от Disk; текущая помечается актуальной.</li>\n          <li><b>Замена документа (новая редакция).</b> Новый документ может «заменять» прежний (поле <code style=\"font-family:'IBM Plex Mono';font-size:12px;\">supersedes_id</code>): старый переводится в «В архиве» с пометкой «заменён», новый ссылается на него. История обоих сохраняется.</li>\n        </ul>\n        <div style=\"padding: 12px 14px; background: #fafafa; border: 1px solid #ededed; border-radius: 9px; font-size: 12.5px; line-height: 1.55; color: #52525b;\">Жёсткого удаления нет — только soft-delete (BR-06); заменённые версии и документы остаются доступны для аудита. Все замены фиксируются в журнале истории документа.</div>\n      </div>\n\n      <!-- 7 ui + nfr -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">15 · ТЕХНИЧЕСКИЙ УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 14px; letter-spacing: -.5px;\">Интерфейс и нефункциональные требования</h2>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 4px 0 9px;\">Экраны (полные скриншоты — раздел 8 «Экраны системы»)</h3>\n        <ul style=\"font-size: 13.5px; line-height: 1.7; color: #3f3f46; margin: 0 0 16px; padding-left: 20px;\">\n          <li><b>Полноэкранный реестр</b> — плотная таблица, разделы слева, виды/фильтры/поиск, bulk‑панель, экспорт.</li>\n          <li><b>Встроенная вкладка в сделке</b> — сводка, матрица «Раздел × Статус» (сводка по числу документов раздела в каждом статусе), документы по разделам со сворачиванием, контекстное добавление.</li>\n          <li><b>Встроенная вкладка в компании</b> — все сделки контрагента; представления «По сделкам» (каждую сделку можно развернуть → матрица + документы) и «По документам» (документы по типам).</li>\n          <li><b>Карточка документа (drawer)</b> — реквизиты (ядро + поля типа), содержимое (файлы + ссылки), привязки, смена статуса, история.</li>\n          <li><b>Мастер создания</b> — 3 шага: раздел/тип → реквизиты + динамические поля типа + содержимое → привязки и подтверждение.</li>\n          <li><b>Администрирование</b> (роль admin) — справочники разделов и типов, конструктор полей типа, lifecycle статусов, политики ролей, обучающие материалы.</li>        </ul>\n        <div style=\"font-size: 13px; line-height: 1.6; color: #3f3f46; margin-bottom: 18px;\">Принципы: плотно и информативно, цветовой код по разделам и статусам, permission‑aware (недоступное скрыто), desktop (1280px+), контраст WCAG AA, русский язык.</div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 4px 0 9px;\">Стек и НФТ</h3>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 9px; font-size: 12.5px;\">\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px;\"><b>Backend:</b> Node.js 20+, TypeScript, Express, Drizzle ORM, PostgreSQL 16+, zod, pino</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px;\"><b>Frontend:</b> React 18, TypeScript, Vite, React Query, Zustand, BX24 JS SDK</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px;\"><b>Производительность:</b> реестр (50 строк) ≤ 1.5 c, /me/policy ≤ 200 мс</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px;\"><b>Безопасность:</b> скоуп по portal_url, серверная проверка прав, только https‑ссылки, санитизация</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px;\"><b>Хранение:</b> файлы — Bitrix Disk; метаданные — PostgreSQL (РФ, 152‑ФЗ)</div>\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px;\"><b>Браузеры:</b> Chrome / Edge / Firefox / Safari (последние 2 версии)</div>\n        </div>\n      </div>\n\n      <!-- 8 plan -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">16 · ПЛАН И ПРИЁМКА</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Этапы реализации и приёмка</h2>\n        <div style=\"display: flex; gap: 10px; margin-bottom: 22px;\">\n          <div style=\"flex: 1; border: 1px solid #ededed; border-radius: 11px; padding: 15px; position: relative;\"><div style=\"position:absolute;top:13px;right:15px;font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#ededed;\">1</div><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 14px; color: #4f46e5;\">Проектирование</div><ul style=\"font-size: 12px; line-height: 1.55; color: #3f3f46; margin: 8px 0 0; padding-left: 16px;\"><li>уточнение требований</li><li>структура документов и связей</li><li>роли и права</li><li>проектирование интерфейса</li></ul></div>\n          <div style=\"flex: 1; border: 1px solid #ededed; border-radius: 11px; padding: 15px; position: relative;\"><div style=\"position:absolute;top:13px;right:15px;font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#ededed;\">2</div><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 14px; color: #4f46e5;\">Базовый функционал</div><ul style=\"font-size: 12px; line-height: 1.55; color: #3f3f46; margin: 8px 0 0; padding-left: 16px;\"><li>сущности и API</li><li>карточка и список документов</li><li>загрузка файлов и ссылок</li><li>привязки и контекст</li></ul></div>\n          <div style=\"flex: 1; border: 1px solid #ededed; border-radius: 11px; padding: 15px; position: relative;\"><div style=\"position:absolute;top:13px;right:15px;font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#ededed;\">3</div><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 14px; color: #4f46e5;\">Доработка и запуск</div><ul style=\"font-size: 12px; line-height: 1.55; color: #3f3f46; margin: 8px 0 0; padding-left: 16px;\"><li>фильтры, виды, статусы</li><li>ролевые ограничения</li><li>тестирование, правки</li><li>запуск в эксплуатацию</li></ul></div>\n        </div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 4px 0 10px;\">Критерии приёмки</h3>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3f3f46;\">\n          <div style=\"display: flex; gap: 9px; align-items: flex-start;\"><span style=\"color: #15803d;\">✓</span> Раздел открывается в карточке сделки, компании и в левом меню; placement’ы зарегистрированы.</div>\n          <div style=\"display: flex; gap: 9px; align-items: flex-start;\"><span style=\"color: #15803d;\">✓</span> Документ создаётся мастером, привязывается к сделке и компании Bitrix24, виден в обоих контекстах.</div>\n          <div style=\"display: flex; gap: 9px; align-items: flex-start;\"><span style=\"color: #15803d;\">✓</span> Прикрепляются файл (Bitrix Disk) и внешняя ссылка; смена статуса работает по lifecycle.</div>\n          <div style=\"display: flex; gap: 9px; align-items: flex-start;\"><span style=\"color: #15803d;\">✓</span> Фильтры, поиск, сохранённые виды и экспорт XLSX работают.</div>\n          <div style=\"display: flex; gap: 9px; align-items: flex-start;\"><span style=\"color: #15803d;\">✓</span> Ролевая модель: для менеджера продаж суммы скрыты, недоступные разделы и кнопки отсутствуют (проверка на сервере).</div>\n          <div style=\"display: flex; gap: 9px; align-items: flex-start;\"><span style=\"color: #15803d;\">✓</span> typecheck / lint / сборка проходят без ошибок.</div>\n        </div>\n        <div style=\"margin-top: 22px; padding: 14px 16px; background: #f6fbf8; border: 1px solid #e2f2e8; border-radius: 11px; font-size: 12.5px; line-height: 1.6; color: #1f5135;\"><b style=\"color:#15803d;\">Зафиксировано на старте:</b> из CRM тянется только статус сделки (категории сделок отдельно не ведём); перечень типов документов задаётся в разделе «Администрирование»; объём Bitrix Disk — 1 ТБ; лимита на размер файла нет. <b>Остаётся уточнить:</b> маппинг отделов Bitrix → роли.</div>\n      </div>\n\n      <!-- signatures -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">ПОДПИСИ СТОРОН</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px; margin-bottom:8px;\">Согласование</h2>\n        <p style=\"font-size:13px; color:#52525b; line-height:1.6; margin:0 0 20px;\">Настоящее техническое задание является Приложением №1 к Договору №19082 от 27.04.2026 и вступает в силу с момента подписания обеими сторонами. Объём, описанный в разделах 1–11 (бизнес-уровень) и 12–16 (технический уровень), считается согласованным.</p>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px;\">\n          <div><div style=\"font-size:10.5px; color:#a1a1aa; text-transform:uppercase; letter-spacing:.5px;\">Заказчик</div><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:15px; margin-top:3px;\">ООО «ТЕРМОМЕХАНИКС»</div><div style=\"margin-top:42px; border-top:1px solid #d4d4d8; padding-top:7px; font-size:11.5px; color:#71717a; display:flex; justify-content:space-between;\"><span>подпись / М.П.</span><span>«___» __________ 2026 г.</span></div></div>\n          <div><div style=\"font-size:10.5px; color:#a1a1aa; text-transform:uppercase; letter-spacing:.5px;\">Исполнитель</div><div style=\"font-family:'Space Grotesk'; font-weight:600; font-size:15px; margin-top:3px;\">ИП Навроцкий А.О.</div><div style=\"margin-top:42px; border-top:1px solid #d4d4d8; padding-top:7px; font-size:11.5px; color:#71717a; display:flex; justify-content:space-between;\"><span>подпись / М.П.</span><span>«___» __________ 2026 г.</span></div></div>\n        </div>\n      </div>\n\n    </div>\n  </div>\n  </sc-if>\n\n  </div>\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 820}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.bulkNativeDragHandler = event => {\n      const zone = event.target && event.target.closest\n        ? event.target.closest('#bulk-drop-zone-v2')\n        : null;\n      if (!zone) return;\n      event.preventDefault();\n      if (event.type === 'drop') this.addBulkFiles(event.dataTransfer ? event.dataTransfer.files : []);\n    };\n    document.addEventListener('dragover', this.bulkNativeDragHandler, true);\n    document.addEventListener('drop', this.bulkNativeDragHandler, true);\n    this.tzSelectionHandler = event => this.captureTzSelection(event);\n    this.tzHighlightClickHandler = event => this.openTzCommentAtPoint(event);\n    document.addEventListener('mouseup', this.tzSelectionHandler, true);\n    document.addEventListener('keyup', this.tzSelectionHandler, true);\n    document.addEventListener('click', this.tzHighlightClickHandler, true);\n    const tzComments = this.loadTzComments();\n    if (tzComments.length) this.setState({ tzComments });\n    requestAnimationFrame(() => this.forceUpdate());\n  }\n\n  componentDidUpdate() {\n    this.scheduleTzHighlights();\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('dragover', this.bulkNativeDragHandler, true);\n    document.removeEventListener('drop', this.bulkNativeDragHandler, true);\n    document.removeEventListener('mouseup', this.tzSelectionHandler, true);\n    document.removeEventListener('keyup', this.tzSelectionHandler, true);\n    document.removeEventListener('click', this.tzHighlightClickHandler, true);\n    if (this.tzHighlightFrame) cancelAnimationFrame(this.tzHighlightFrame);\n    if (window.CSS && CSS.highlights) {\n      CSS.highlights.delete('tz-comment-highlight');\n      CSS.highlights.delete('tz-comment-highlight-active');\n    }\n  }\n\n  tzCommentStorageKey() {\n    return 'termech-tz-comments-v2';\n  }\n\n  loadTzComments() {\n    try {\n      const stored = JSON.parse(localStorage.getItem(this.tzCommentStorageKey()) || '[]');\n      if (!Array.isArray(stored)) return [];\n      return stored.filter(item =>\n        item\n        && typeof item.id === 'string'\n        && typeof item.quote === 'string'\n        && item.anchor\n        && Number.isFinite(item.anchor.start)\n        && Number.isFinite(item.anchor.end)\n      ).map(item => ({\n        ...item,\n        body: String(item.body || ''),\n        author: String(item.author || 'Вы'),\n        createdAt: item.createdAt || new Date().toISOString(),\n        resolved: !!item.resolved,\n        replies: Array.isArray(item.replies) ? item.replies : [],\n      }));\n    } catch {\n      return [];\n    }\n  }\n\n  saveTzComments(comments, patch = {}) {\n    try {\n      localStorage.setItem(this.tzCommentStorageKey(), JSON.stringify(comments));\n    } catch {\n      // The prototype still works for the current session when storage is unavailable.\n    }\n    this.setState({ tzComments: comments, ...patch });\n  }\n\n  tzTextNodes(root = document.querySelector('.tz-page')) {\n    if (!root) return [];\n    const nodes = [];\n    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {\n      acceptNode: node => {\n        if (!node.nodeValue || !node.nodeValue.length) return NodeFilter.FILTER_REJECT;\n        const parent = node.parentElement;\n        if (!parent) return NodeFilter.FILTER_REJECT;\n        if (parent.closest('.tz-jump-nav, .tz-comments-panel, .tz-selection-action, button, textarea, input, select, script, style')) {\n          return NodeFilter.FILTER_REJECT;\n        }\n        return NodeFilter.FILTER_ACCEPT;\n      },\n    });\n    while (walker.nextNode()) nodes.push(walker.currentNode);\n    return nodes;\n  }\n\n  tzGlobalOffset(nodes, node, offset) {\n    if (!node || node.nodeType !== Node.TEXT_NODE) return null;\n    let total = 0;\n    for (const item of nodes) {\n      if (item === node) return total + Math.max(0, Math.min(offset, item.nodeValue.length));\n      total += item.nodeValue.length;\n    }\n    return null;\n  }\n\n  tzResolvedAnchor(comment, nodes) {\n    const text = nodes.map(node => node.nodeValue).join('');\n    let start = Math.max(0, Math.min(comment.anchor.start, text.length));\n    let end = Math.max(start, Math.min(comment.anchor.end, text.length));\n    if (text.slice(start, end) === comment.quote) return { start, end };\n    let nearest = -1;\n    let nearestDistance = Number.POSITIVE_INFINITY;\n    let from = 0;\n    while (from <= text.length) {\n      const found = text.indexOf(comment.quote, from);\n      if (found < 0) break;\n      const distance = Math.abs(found - start);\n      if (distance < nearestDistance) {\n        nearest = found;\n        nearestDistance = distance;\n      }\n      from = found + Math.max(1, comment.quote.length);\n    }\n    if (nearest >= 0) {\n      start = nearest;\n      end = nearest + comment.quote.length;\n    }\n    return { start, end };\n  }\n\n  tzRangeForAnchor(anchor, nodes) {\n    let cursor = 0;\n    let startNode = null;\n    let startOffset = 0;\n    let endNode = null;\n    let endOffset = 0;\n    for (const node of nodes) {\n      const next = cursor + node.nodeValue.length;\n      if (!startNode && anchor.start >= cursor && anchor.start <= next) {\n        startNode = node;\n        startOffset = anchor.start - cursor;\n      }\n      if (!endNode && anchor.end >= cursor && anchor.end <= next) {\n        endNode = node;\n        endOffset = anchor.end - cursor;\n        break;\n      }\n      cursor = next;\n    }\n    if (!startNode || !endNode) return null;\n    const range = document.createRange();\n    range.setStart(startNode, Math.max(0, Math.min(startOffset, startNode.nodeValue.length)));\n    range.setEnd(endNode, Math.max(0, Math.min(endOffset, endNode.nodeValue.length)));\n    return range.collapsed ? null : range;\n  }\n\n  scheduleTzHighlights() {\n    if (this.tzHighlightFrame) cancelAnimationFrame(this.tzHighlightFrame);\n    this.tzHighlightFrame = requestAnimationFrame(() => {\n      this.tzHighlightFrame = null;\n      this.applyTzHighlights();\n    });\n  }\n\n  applyTzHighlights() {\n    if (!window.CSS || !CSS.highlights || typeof window.Highlight !== 'function') return;\n    CSS.highlights.delete('tz-comment-highlight');\n    CSS.highlights.delete('tz-comment-highlight-active');\n    if (this.state.mode !== 'tz') return;\n    const nodes = this.tzTextNodes();\n    if (!nodes.length) return;\n    const normal = new window.Highlight();\n    const active = new window.Highlight();\n    (this.state.tzComments || []).forEach(comment => {\n      if (comment.resolved && this.state.tzActiveCommentId !== comment.id) return;\n      const anchor = this.tzResolvedAnchor(comment, nodes);\n      const range = this.tzRangeForAnchor(anchor, nodes);\n      if (!range) return;\n      if (this.state.tzActiveCommentId === comment.id) active.add(range);\n      else normal.add(range);\n    });\n    if (normal.size) CSS.highlights.set('tz-comment-highlight', normal);\n    if (active.size) CSS.highlights.set('tz-comment-highlight-active', active);\n  }\n\n  captureTzSelection(event) {\n    if (this.state.mode !== 'tz') return;\n    const target = event && event.target && event.target.closest ? event.target : null;\n    if (target && target.closest('.tz-comments-panel, .tz-selection-action, .tz-jump-nav, button, textarea, input, select')) return;\n    const root = document.querySelector('.tz-page');\n    const selection = window.getSelection();\n    if (!root || !selection || selection.rangeCount === 0 || selection.isCollapsed) {\n      if (this.state.tzSelectionReady) this.setState({ tzSelectionReady: false });\n      return;\n    }\n    const range = selection.getRangeAt(0);\n    if (!root.contains(range.startContainer) || !root.contains(range.endContainer)) return;\n    const nodes = this.tzTextNodes(root);\n    let start = this.tzGlobalOffset(nodes, range.startContainer, range.startOffset);\n    let end = this.tzGlobalOffset(nodes, range.endContainer, range.endOffset);\n    if (start == null || end == null || end <= start) return;\n    const rawQuote = selection.toString();\n    const quote = rawQuote.trim();\n    if (!quote || quote.length < 2) return;\n    const leading = rawQuote.indexOf(quote);\n    start += Math.max(0, leading);\n    end = start + quote.length;\n    const rect = range.getBoundingClientRect();\n    const left = Math.max(10, Math.min(window.innerWidth - 154, rect.left + rect.width / 2 - 72));\n    const top = Math.max(54, rect.top - 44);\n    selection.removeAllRanges();\n    this.setState({\n
