ight: 600; font-size: 13.5px;\">Поля типа</div>\n          <span style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #a1a1aa;\">{{ ntFieldCount }}</span>\n          <div style=\"flex: 1;\"></div>\n          <button type=\"button\" onclick=\"{{ ntAddBlank }}\" style=\"background: #eef2ff; color: #4f46e5; border: 1px solid #dfe3fb; border-radius: 7px; padding: 5px 11px; font-size: 11.5px; font-weight: 500; cursor: pointer;\">＋ Поле</button>\n        </div>\n        <div style=\"font-size: 11px; color: #a1a1aa; margin: 6px 0 10px;\">Эти поля появятся в мастере создания документа этого типа и в карточке документа.</div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n          <sc-for list=\"{{ newTypeFields }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <div style=\"display: grid; grid-template-columns: 1fr 130px 78px 26px; gap: 8px; align-items: center;\">\n              <input value=\"{{ f.name }}\" oninput=\"{{ f.onName }}\" placeholder=\"Название поля\" style=\"padding: 7px 9px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 12.5px;\">\n              <select value=\"{{ f.dtype }}\" onchange=\"{{ f.onType }}\" style=\"padding: 7px 9px; border: 1px solid #e4e4e7; border-radius: 7px; font-size: 12.5px;\">\n                <sc-for list=\"{{ dataTypes }}\" as=\"dt\" hint-placeholder-count=\"5\"><option value=\"{{ dt }}\">{{ dt }}</option></sc-for>\n              </select>\n              <div onclick=\"{{ f.onReq }}\" style=\"display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; color: #52525b;\"><span style=\"{{ f.reqStyle }}\">{{ f.reqMark }}</span>обяз.</div>\n              <button type=\"button\" onclick=\"{{ f.onRemove }}\" style=\"background: none; border: none; color: #c4c4c8; font-size: 14px; cursor: pointer;\">✕</button>\n            </div>\n          </sc-for>\n        </div>\n\n        <div style=\"margin-top: 14px; padding: 12px 14px; background: #fafafa; border: 1px solid #ededed; border-radius: 9px;\">\n          <div style=\"font-size: 11px; color: #71717a; margin-bottom: 8px;\">Быстро из библиотеки полей (переиспользуются между типами):</div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n            <sc-for list=\"{{ libraryChips }}\" as=\"lc\" hint-placeholder-count=\"6\">\n              <button type=\"button\" onclick=\"{{ lc.onAdd }}\" style=\"background: #fff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 5px 11px; font-size: 11.5px; color: #3f3f46; cursor: pointer;\">＋ {{ lc.name }}</button>\n            </sc-for>\n          </div>\n        </div>\n      </div>\n      <div style=\"padding: 14px 22px; border-top: 1px solid #ededed; display: flex; align-items: center; gap: 10px;\">\n        <span style=\"font-size: 11.5px; color: #a1a1aa;\">Тип сохранится в справочник «Типы документов».</span>\n        <div style=\"flex: 1;\"></div>\n        <button type=\"button\" onclick=\"{{ closeTypeModal }}\" style=\"background: none; border: 1px solid #e4e4e7; border-radius: 8px; padding: 9px 16px; font-size: 12.5px; color: #52525b; cursor: pointer;\">Отмена</button>\n        <button type=\"button\" onclick=\"{{ ntCreate }}\" style=\"{{ ntCreateStyle }}\">Создать тип</button>\n      </div>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ░░ HELP / TRAINING MODAL ░░ -->\n  <sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 56; display: flex; align-items: center; justify-content: center;\">\n    <div onclick=\"{{ closeHelp }}\" style=\"position: absolute; inset: 0; background: rgba(24,24,27,.4); animation: dcFade .12s;\"></div>\n    <div style=\"position: relative; width: 600px; max-height: 86vh; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; animation: dcFade .18s; overflow: hidden;\">\n      <div style=\"padding: 16px 22px; border-bottom: 1px solid #ededed; display: flex; align-items: center; gap: 12px;\">\n        <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 16px;\">Помощь и обучение</div>\n        <div style=\"flex: 1;\"></div>\n        <button type=\"button\" onclick=\"{{ closeHelp }}\" style=\"background: none; border: none; font-size: 18px; color: #a1a1aa; cursor: pointer;\">✕</button>\n      </div>\n      <div style=\"flex: 1; overflow-y: auto; padding: 16px 22px;\">\n        <div style=\"font-size: 12px; color: #a1a1aa; margin-bottom: 12px;\">Материалы доступны всем ролям. Состав управляется в Администрировании → Обучение.</div>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <sc-for list=\"{{ trainingItems }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"border: 1px solid #ededed; border-radius: 10px; padding: 12px 14px; display: flex; gap: 11px; cursor: pointer;\">\n              <div style=\"width: 30px; height: 30px; border-radius: 8px; background: #eef2ff; color: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none;\">{{ t.icon }}</div>\n              <div style=\"min-width: 0;\">\n                <div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 13px;\">{{ t.title }}</div>\n                <div style=\"font-size: 11.5px; color: #52525b; margin-top: 2px; line-height: 1.5;\">{{ t.desc }}</div>\n                <div style=\"font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #a1a1aa; margin-top: 5px;\">{{ t.kind }}</div>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ░░ XLSX PREVIEW V2 ░░ -->\n  <sc-if value=\"{{ xlsxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 58; display: flex; align-items: center; justify-content: center; padding: 18px;\">\n    <div onclick=\"{{ closeXlsx }}\" style=\"position: absolute; inset: 0; background: rgba(24,24,27,.4); animation: dcFade .12s;\"></div>\n    <div style=\"position: relative; width: min(920px, 96vw); max-height: 86vh; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; animation: dcFade .18s; overflow: hidden;\">\n      <div style=\"padding: 16px 20px; border-bottom: 1px solid #ededed; display: flex; align-items: center; gap: 10px;\"><span style=\"color: #7c3aed; font-size: 10px; font-weight: 750;\">[v2]</span><div><div style=\"font-family: 'Space Grotesk'; font-weight: 650; font-size: 16px;\">Предпросмотр XLSX</div><div style=\"font-size: 10.5px; color: #71717a; margin-top: 2px;\">Только текущие видимые колонки · {{ xlsxColumnCount }} колонок · первые 4 строки текущего среза</div></div><div style=\"flex: 1;\"></div><button type=\"button\" onclick=\"{{ closeXlsx }}\" style=\"background: none; border: none; font-size: 18px; color: #a1a1aa; cursor: pointer;\">✕</button></div>\n      <div style=\"flex: 1; overflow: auto; padding: 16px 20px;\">\n        <div style=\"border: 1px solid #e4e4e7; border-radius: 9px; overflow: auto;\">\n          <div style=\"{{ xlsxGridStyle }} background:#eef2ff;color:#4338ca;font-size:10px;text-transform:uppercase;letter-spacing:.35px;font-weight:650;\">\n            <sc-for list=\"{{ xlsxColumns }}\" as=\"col\" hint-placeholder-count=\"8\"><div style=\"padding: 8px 9px; border-right: 1px solid #dfe3fb;\">{{ col.label }}</div></sc-for>\n          </div>\n          <sc-for list=\"{{ xlsxPreviewRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n            <div style=\"{{ xlsxGridStyle }} border-top:1px solid #f4f4f5;font-size:10.5px;color:#3f3f46;\">\n              <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"8\"><div style=\"padding: 8px 9px; border-right: 1px solid #f4f4f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ cell.value }}</div></sc-for>\n            </div>\n          </sc-for>\n        </div>\n        <div style=\"font-size: 10.5px; color: #71717a; line-height: 1.45; margin-top: 10px;\">В рабочей системе экспорт применит активный поиск, фильтры, сохранённый вид и серверную политику доступа текущей роли.</div>\n      </div>\n      <div style=\"padding: 12px 20px; border-top: 1px solid #ededed; display: flex; align-items: center; gap: 10px;\"><span style=\"font-size: 10.5px; color: #a1a1aa;\">Прототип: файл не создаётся.</span><div style=\"flex: 1;\"></div><button type=\"button\" onclick=\"{{ closeXlsx }}\" style=\"background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 11.5px; font-weight: 650; cursor: pointer;\">Понятно</button></div>\n    </div>\n  </div>\n  </sc-if>\n\n  </div>\n  </sc-if>\n\n  <!-- ════════ TZ MODE ════════ -->\n  <sc-if value=\"{{ isTz }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"height: 100%; overflow-y: auto; background: #f4f4f5;\">\n    <div class=\"tz-page\">\n\n      <!-- cover -->\n      <div id=\"tz-top\" class=\"tz-surface tz-cover\" style=\"scroll-margin-top: 72px;\">\n        <div style=\"position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #4f46e5;\"></div>\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 12px; color: #4f46e5; letter-spacing: 1px;\">ПРИЛОЖЕНИЕ №1 К ДОГОВОРУ №19082 ОТ 27.04.2026</div>\n        <h1 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 33px; line-height: 1.12; letter-spacing: -1px; margin: 10px 0 0;\">Техническое задание<br>«Реестр документов» в Bitrix24</h1>\n        <div style=\"font-size: 16px; color: #52525b; margin-top: 10px; line-height: 1.5;\">Единый встроенный сервис документооборота по сделкам и компаниям-контрагентам.</div>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px;\">\n          <div style=\"border: 1px solid #ededed; border-radius: 10px; padding: 13px 16px;\"><div style=\"font-size: 10.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px;\">Заказчик</div><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin-top: 3px;\">ООО «ТЕРМОМЕХАНИКС»</div></div>\n          <div style=\"border: 1px solid #ededed; border-radius: 10px; padding: 13px 16px;\"><div style=\"font-size: 10.5px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .5px;\">Исполнитель</div><div style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin-top: 3px;\">ИП Навроцкий А.О.</div></div>\n        </div>\n        <div style=\"display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 11.5px; color: #71717a; font-family: 'IBM Plex Mono';\"><span>Документ: ТЗ · v2.0</span><span>Основание: Договор №19082 от 27.04.2026</span><span>Дата редакции: 29.07.2026</span></div>\n        <div style=\"margin-top: 18px; padding: 14px 16px; background: #faf5ff; border: 1px solid #ddd6fe; border-radius: 10px; font-size: 13px; line-height: 1.6; color: #3f3f46;\"><span style=\"color: #7c3aed; font-weight: 750;\">[v2]</span> Синхронизированная редакция после сверки исходного ТЗ v1.1, цветных замечаний Google Docs, полной транскрипции встречи 17.07.2026 и согласованных уточнений Заказчика. При конфликте с прежним текстом решения блока «v2.0» имеют приоритет.</div>\n      </div>\n\n      <nav class=\"tz-jump-nav\" aria-label=\"Навигация по изменениям ТЗ v2.0\">\n        <button type=\"button\" class=\"tz-jump-primary\" onclick=\"{{ scrollTzOverview }}\">Обзор v2.0</button>\n        <button type=\"button\" onclick=\"{{ scrollTzChanges }}\">Все изменения</button>\n        <button type=\"button\" onclick=\"{{ scrollTzConflicts }}\">Было → стало</button>\n        <button type=\"button\" onclick=\"{{ scrollTzMeeting }}\">Решения созвона</button>\n        <button type=\"button\" onclick=\"{{ scrollTzTrace }}\">Матрица и экраны</button>\n        <button type=\"button\" onclick=\"{{ scrollTzFull }}\">Полный текст ТЗ</button>\n        <button type=\"button\" class=\"tz-comments-toggle\" onclick=\"{{ openTzComments }}\" aria-label=\"Открыть комментарии к техническому заданию\"><span>◧</span><span>Комментарии</span><span class=\"tz-comments-count\">{{ tzOpenCommentCount }}</span></button>\n      </nav>\n\n      <sc-if value=\"{{ tzSelectionReady }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" class=\"tz-selection-action\" style=\"{{ tzSelectionActionStyle }}\" onclick=\"{{ startTzComment }}\"><span>＋</span><span>Комментировать</span></button>\n      </sc-if>\n\n      <sc-if value=\"{{ tzCommentsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <aside class=\"tz-comments-panel\" aria-label=\"Комментарии к техническому заданию\">\n          <div class=\"tz-comments-head\">\n            <div class=\"tz-comments-title-row\">\n              <div class=\"tz-comments-title\">Комментарии к ТЗ</div>\n              <span class=\"tz-comments-count\">{{ tzOpenCommentCount }}</span>\n              <button type=\"button\" class=\"tz-comments-close\" onclick=\"{{ closeTzComments }}\" aria-label=\"Закрыть панель комментариев\">×</button>\n            </div>\n            <div style=\"margin-top:4px;color:#71717a;font-size:10.5px;line-height:1.4;\">Выделите фрагмент текста и нажмите «Комментировать».</div>\n            <div class=\"tz-comments-tabs\">\n              <button type=\"button\" class=\"tz-comments-tab\" style=\"{{ tzOpenTabStyle }}\" onclick=\"{{ showOpenTzComments }}\">Открытые · {{ tzOpenCommentCount }}</button>\n              <button type=\"button\" class=\"tz-comments-tab\" style=\"{{ tzResolvedTabStyle }}\" onclick=\"{{ showResolvedTzComments }}\">Закрытые · {{ tzResolvedCommentCount }}</button>\n            </div>\n          </div>\n          <div class=\"tz-comments-body\">\n            <sc-if value=\"{{ tzComposerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"tz-comment-compose\">\n                <div style=\"font-size:10px;color:#6d28d9;font-weight:700;margin-bottom:6px;\">Новый комментарий к фрагменту</div>\n                <blockquote class=\"tz-comment-quote\">«{{ tzPendingQuote }}»</blockquote>\n                <textarea class=\"tz-comment-textarea\" value=\"{{ tzCommentDraft }}\" oninput=\"{{ setTzCommentDraft }}\" placeholder=\"Напишите замечание или вопрос\"></textarea>\n                <div class=\"tz-comment-compose-actions\">\n                  <button type=\"button\" class=\"tz-comment-button\" onclick=\"{{ cancelTzComment }}\">Отмена</button>\n                  <button type=\"button\" class=\"tz-comment-button tz-comment-button-primary\" onclick=\"{{ addTzComment }}\">Добавить комментарий</button>\n                </div>\n              </div>\n            </sc-if>\n\n            <sc-if value=\"{{ tzNoCommentThreads }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"tz-comments-empty\">\n                <div class=\"tz-comments-empty-icon\">◧</div>\n                <div>{{ tzEmptyCommentText }}</div>\n              </div>\n            </sc-if>\n\n            <sc-if value=\"{{ tzHasCommentThreads }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"tz-comment-list\">\n                <sc-for list=\"{{ tzCommentThreads }}\" as=\"thread\" hint-placeholder-count=\"3\">\n                  <article class=\"tz-comment-thread\" style=\"{{ thread.style }}\">\n                    <div class=\"tz-comment-meta\">\n                      <span class=\"tz-comment-avatar\">{{ thread.initials }}</span>\n                      <div><div class=\"tz-comment-author\">{{ thread.author }}</div><div class=\"tz-comment-time\">{{ thread.time }}</div></div>\n                      <sc-if value=\"{{ thread.resolved }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tz-comment-status\">Закрыто</span></sc-if>\n                    </div>\n                    <button type=\"button\" class=\"tz-comment-quote\" onclick=\"{{ thread.onFocus }}\" style=\"width:100%;border-top:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;margin-top:9px;\">«{{ thread.quote }}»</button>\n                    <div class=\"tz-comment-body\">{{ thread.body }}</div>\n                    <sc-if value=\"{{ thread.hasReplies }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div class=\"tz-comment-replies\">\n                        <sc-for list=\"{{ thread.replies }}\" as=\"reply\" hint-placeholder-count=\"2\">\n                          <div class=\"tz-comment-reply\"><div class=\"tz-comment-reply-meta\">{{ reply.author }} · {{ reply.time }}</div><div>{{ reply.body }}</div></div>\n                        </sc-for>\n                      </div>\n                    </sc-if>\n                    <div class=\"tz-comment-actions\">\n                      <button type=\"button\" class=\"tz-comment-link\" onclick=\"{{ thread.onFocus }}\">К тексту</button>\n                      <sc-if value=\"{{ thread.open }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button type=\"button\" class=\"tz-comment-link\" onclick=\"{{ thread.onReply }}\">Ответить</button>\n                        <button type=\"button\" class=\"tz-comment-link\" onclick=\"{{ thread.onResolve }}\">Закрыть обсуждение</button>\n                      </sc-if>\n                      <sc-if value=\"{{ thread.resolved }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button type=\"button\" class=\"tz-comment-link\" onclick=\"{{ thread.onReopen }}\">Восстановить</button>\n                      </sc-if>\n                    </div>\n                    <sc-if value=\"{{ thread.replyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div class=\"tz-comment-reply-box\">\n                        <textarea class=\"tz-comment-textarea\" value=\"{{ thread.replyDraft }}\" oninput=\"{{ thread.onReplyInput }}\" placeholder=\"Ответить в ветке\"></textarea>\n                        <div class=\"tz-comment-compose-actions\">\n                          <button type=\"button\" class=\"tz-comment-button\" onclick=\"{{ thread.onCancelReply }}\">Отмена</button>\n                          <button type=\"button\" class=\"tz-comment-button tz-comment-button-primary\" onclick=\"{{ thread.onSendReply }}\">Отправить</button>\n                        </div>\n                      </div>\n                    </sc-if>\n                  </article>\n                </sc-for>\n              </div>\n            </sc-if>\n          </div>\n        </aside>\n      </sc-if>\n\n      <!-- v2 overview -->\n      <section id=\"tz-v2-overview\" class=\"tz-surface tz-section\">\n        <div class=\"tz-eyebrow\">Редакция v2.0 · 29.07.2026</div>\n        <h2 class=\"tz-section-title\">Что вошло в обновлённое ТЗ</h2>\n        <p class=\"tz-section-lead\">Эта HTML-версия собирает решения в одном месте. Ниже можно увидеть исходную формулировку, принятое правило, подробности реализации и экран, на котором проверяется результат.</p>\n        <div class=\"tz-legend\">\n          <span class=\"tz-chip tz-chip-v2\">[v2] новое или изменённое</span>\n          <span class=\"tz-chip tz-chip-ready\">показано в прототипе</span>\n          <span class=\"tz-chip tz-chip-spec\">зафиксировано в ТЗ</span>\n          <span class=\"tz-chip tz-chip-deferred\">[отложено] следующая фаза</span>\n          <span class=\"tz-chip tz-chip-estimate\">[оценка] до разработки</span>\n        </div>\n        <div id=\"tz-device-scope\" style=\"margin-top:15px;padding:13px 14px;border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:9px;background:#fef2f2;color:#7f1d1d;font-size:11.5px;line-height:1.55;\"><b>Ограничение первой фазы:</b> мобильной версии не будет. На телефоне открывается десктопный интерфейс без отдельной адаптации. Авторизация доступна только через действующую учётную запись Bitrix24; отдельный вход, OTP и SSO не входят в объём.</div>\n        <div class=\"tz-summary-grid\">\n          <sc-for list=\"{{ v2Summary }}\" as=\"item\" hint-placeholder-count=\"4\">\n            <div class=\"tz-summary-card\"><div class=\"tz-summary-value\">{{ item.value }}</div><div class=\"tz-summary-label\">{{ item.label }}</div></div>\n          </sc-for>\n        </div>\n        <h3 style=\"font-family:'Space Grotesk';font-size:14px;font-weight:650;margin:22px 0 0;\">Что было проверено</h3>\n        <div class=\"tz-source-grid\">\n          <sc-for list=\"{{ v2Sources }}\" as=\"source\" hint-placeholder-count=\"5\">\n            <div class=\"tz-source-card\"><div class=\"tz-source-count\">{{ source.count }}</div><div class=\"tz-source-title\">{{ source.title }}</div><div class=\"tz-source-note\">{{ source.note }}</div></div>\n          </sc-for>\n        </div>\n      </section>\n\n      <!-- all v2 changes -->\n      <section id=\"tz-v2-changes\" class=\"tz-surface tz-section\">\n        <div class=\"tz-eyebrow\">Полный журнал изменений</div>\n        <h2 class=\"tz-section-title\">18 изменений, которые нужно проверить</h2>\n        <p class=\"tz-section-lead\">Первые 14 пунктов повторяют прямые замечания Заказчика. Ещё четыре блока собирают решения созвона, которые влияют на контексты работы, справочники, историю и границы первого запуска.</p>\n        <div style=\"margin-top:22px;\">\n          <sc-for list=\"{{ v2ChangeGroups }}\" as=\"group\" hint-placeholder-count=\"4\">\n            <div class=\"tz-group\">\n              <div class=\"tz-group-heading\"><span class=\"tz-group-number\">{{ group.number }}</span><span class=\"tz-group-title\">{{ group.title }}</span></div>\n              <div class=\"tz-change-list\">\n                <sc-for list=\"{{ group.changes }}\" as=\"change\" hint-placeholder-count=\"5\">\n                  <article class=\"tz-change-card\">\n                    <div class=\"tz-change-head\">\n                      <div class=\"tz-change-index\">{{ change.number }}</div>\n                      <div><div class=\"tz-change-title\">{{ change.title }}</div><div class=\"tz-change-source\">{{ change.source }}</div></div>\n                      <span class=\"tz-chip\" style=\"{{ change.badgeStyle }}\">{{ change.badge }}</span>\n                    </div>\n                    <div class=\"tz-change-body\">\n                      <div class=\"tz-change-before\"><div class=\"tz-field-label\">Было / проблема</div><div class=\"tz-field-text\">{{ change.before }}</div></div>\n                      <div class=\"tz-change-after\">\n                        <div class=\"tz-field-label\">Принято в v2.0</div>\n                        <div class=\"tz-field-text\">{{ change.after }}</div>\n                        <div class=\"tz-detail-list\">\n                          <sc-for list=\"{{ change.details }}\" as=\"detail\" hint-placeholder-count=\"3\">\n                            <div class=\"tz-detail-row\"><span class=\"tz-detail-dot\">•</span><span>{{ detail.text }}</span></div>\n                          </sc-for>\n                        </div>\n                      </div>\n                    </div>\n                    <div class=\"tz-change-check\">\n                      <div class=\"tz-check-copy\"><span style=\"font-family:'IBM Plex Mono';font-size:9px;color:#4f46e5;\">ПРОВЕРКА</span><br>{{ change.verify }}</div>\n                      <button type=\"button\" class=\"tz-open-screen\" onclick=\"{{ change.onOpen }}\">{{ change.actionLabel }} →</button>\n                    </div>\n                  </article>\n                </sc-for>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n      </section>\n\n      <!-- resolved conflicts -->\n      <section id=\"tz-v2-conflicts\" class=\"tz-surface tz-section\">\n        <div class=\"tz-eyebrow\">Сравнение с v1.1 и замечаниями</div>\n        <h2 class=\"tz-section-title\">Семь противоречий сняты</h2>\n        <p class=\"tz-section-lead\">В исходном тексте и обсуждении встречались несовместимые варианты. В колонке «Стало» указано правило, которое действует в редакции v2.0.</p>\n        <div class=\"tz-compare-grid\">\n          <sc-for list=\"{{ v2Conflicts }}\" as=\"conflict\" hint-placeholder-count=\"7\">\n            <div class=\"tz-compare-card\">\n              <div class=\"tz-compare-title\">{{ conflict.title }}</div>\n              <div class=\"tz-compare-row tz-compare-row-old\"><span class=\"tz-compare-key\">Было</span><span>{{ conflict.before }}</span></div>\n              <div class=\"tz-compare-row tz-compare-row-new\"><span class=\"tz-compare-key\">Стало</span><span>{{ conflict.after }}</span></div>\n            </div>\n          </sc-for>\n        </div>\n      </section>\n\n      <!-- meeting decisions -->\n      <section id=\"tz-v2-meeting\" class=\"tz-surface tz-section\">\n        <div class=\"tz-eyebrow\">Созвон 17.07.2026 · 1 час 37 минут</div>\n        <h2 class=\"tz-section-title\">Решения и границы, которые нельзя потерять</h2>\n        <p class=\"tz-section-lead\">Согласованные правила входят в v2.0. Темы без окончательного решения отмечены как следующая фаза или отдельная оценка.</p>\n        <div class=\"tz-decision-grid\">\n          <div class=\"tz-decision-panel\">\n            <div class=\"tz-decision-heading\">Зафиксировано в первой фазе</div>\n            <div class=\"tz-decision-list\">\n              <sc-for list=\"{{ v2MeetingDecisions }}\" as=\"decision\" hint-placeholder-count=\"10\">\n                <div class=\"tz-decision-row\"><span class=\"tz-decision-mark\">✓</span><span>{{ decision.text }}</span></div>\n              </sc-for>\n            </div>\n          </div>\n          <div class=\"tz-decision-panel\">\n            <div class=\"tz-decision-heading\">Следующая фаза или отдельная оценка</div>\n            <div class=\"tz-decision-list\">\n              <sc-for list=\"{{ v2Deferred }}\" as=\"decision\" hint-placeholder-count=\"8\">\n                <div class=\"tz-decision-row\"><span class=\"tz-decision-mark tz-decision-mark-deferred\">…</span><span><span style=\"color:#71717a;font-style:italic;\">{{ decision.marker }}</span> {{ decision.text }}</span></div>\n              </sc-for>\n            </div>\n          </div>\n        </div>\n      </section>\n\n      <!-- traceability and evidence -->\n      <section id=\"tz-v2-trace\" class=\"tz-surface tz-section\">\n        <div class=\"tz-eyebrow\">Трассируемость</div>\n        <h2 class=\"tz-section-title\">Требование → раздел ТЗ → экран</h2>\n        <p class=\"tz-section-lead\">Каждая строка связывает принятое правило с текстом спецификации и проверяемым состоянием прототипа. Кнопка в третьей колонке открывает соответствующий сценарий.</p>\n        <div class=\"tz-trace-table\">\n          <div class=\"tz-trace-row tz-trace-head\"><div class=\"tz-trace-cell\">Требование</div><div class=\"tz-trace-cell\">Раздел ТЗ v2.0</div><div class=\"tz-trace-cell\">Проверяемый экран</div></div>\n          <sc-for list=\"{{ traceabilityRows }}\" as=\"trace\" hint-placeholder-count=\"16\">\n            <div class=\"tz-trace-row\"><div class=\"tz-trace-cell\"><span style=\"color:#7c3aed;font-weight:700;\">[v2]</span> {{ trace.requirement }}</div><div class=\"tz-trace-cell\" style=\"color:#52525b;\">{{ trace.section }}</div><div class=\"tz-trace-cell\"><button type=\"button\" class=\"tz-open-screen\" onclick=\"{{ trace.onOpen }}\">{{ trace.screen }} →</button></div></div>\n          </sc-for>\n        </div>\n        <h3 style=\"font-family:'Space Grotesk';font-size:15px;font-weight:650;margin:24px 0 0;\">Четыре ключевых сценария</h3>\n        <div class=\"tz-evidence-grid\">\n          <sc-for list=\"{{ evidenceScreens }}\" as=\"screen\" hint-placeholder-count=\"4\">\n            <button type=\"button\" class=\"tz-evidence-card\" onclick=\"{{ screen.onOpen }}\"><div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"font-size:10px;color:#7c3aed;font-weight:750;\">[v2]</span><span style=\"font-family:'Space Grotesk';font-weight:650;font-size:12px;\">{{ screen.title }}</span></div><div style=\"font-size:10.5px;color:#71717a;line-height:1.45;margin-top:5px;\">{{ screen.desc }}</div><div style=\"font-size:10.5px;color:#4f46e5;font-weight:650;margin-top:8px;\">Открыть экран →</div></button>\n          </sc-for>\n        </div>\n      </section>\n\n      <section id=\"tz-full-text\" class=\"tz-surface tz-section\">\n        <div class=\"tz-eyebrow\">Полная редакция</div>\n        <h2 class=\"tz-section-title\">Текст ТЗ по разделам</h2>\n        <p class=\"tz-section-lead\">Далее сохранён полный бизнес- и технический уровень спецификации. Журнал выше объясняет, что именно изменилось и где это проверять.</p>\n      </section>\n      <!-- 1 general -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">1 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Общие сведения</h2>\n        <div style=\"border:1px solid #ededed; border-radius:10px; overflow:hidden; font-size:13px;\">\n          <div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Полное наименование</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">Кастомный модуль «Реестр документов» для корпоративного портала Bitrix24</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Условное обозначение</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">«Реестр документов»</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Заказчик</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">ООО «ТЕРМОМЕХАНИКС»</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Исполнитель</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">ИП Навроцкий А.О.</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Основание для разработки</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">Договор №19082 от 27.04.2026. Настоящее ТЗ является Приложением №1 к Договору</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Вид работ</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">Разработка, настройка и ввод в эксплуатацию кастомного модуля Bitrix24</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Среда функционирования</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">Корпоративный портал Bitrix24 Заказчика, облачный тариф, оплаченный доступ к Маркетплейсу Битрикс24</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; border-bottom:1px solid #f4f4f5;\">Способ поставки</div><div style=\"padding:10px 14px; color:#3f3f46; border-bottom:1px solid #f4f4f5;\">Установка на портал Заказчика, передача исходного кода Исполнителем</div></div><div style=\"display:grid; grid-template-columns:230px 1fr;\"><div style=\"background:#fafafa; padding:10px 14px; color:#71717a; \">Язык интерфейса</div><div style=\"padding:10px 14px; color:#3f3f46; \">Русский</div></div>\n        </div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 10px;\">Чем является и чем не является</h3>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px;\">\n          <div style=\"border:1px solid #e2f2e8; background:#f6fbf8; border-radius:10px; padding:13px 15px; font-size:13px; line-height:1.55; color:#1f5135;\"><b>Является</b> — сервисом с собственной моделью данных, классификацией, ролями и логикой статусов, встроенным в карточки Bitrix24.</div>\n          <div style=\"border:1px solid #fde2e2; background:#fdf6f6; border-radius:10px; padding:13px 15px; font-size:13px; line-height:1.55; color:#7a1f1f;\"><b>Не является</b> — простой вкладкой с файлами, файловым хранилищем или системой юридически значимого ЭДО с подписанием КЭП.</div>\n        </div>\n      </div>\n      <!-- 2 glossary -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">2 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Термины и определения</h2>\n        <p style=\"font-size: 14px; line-height: 1.65; color: #3f3f46; margin: 0 0 14px;\">Единый словарь для устранения разночтений между Заказчиком и Исполнителем при согласовании и приёмке.</p>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px;\">\n          <div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Реестр</span><span style=\"color:#52525b;\"> — Сервис учёта, хранения, классификации и поиска карточек документов.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Документ (карточка)</span><span style=\"color:#52525b;\"> — Запись с реквизитами, содержимым и связями. По умолчанию требуется файл либо HTTPS-ссылка; администратор может разрешить добавить содержимое позже для конкретного типа.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Содержимое</span><span style=\"color:#52525b;\"> — Файл на Bitrix Disk либо внешняя HTTPS-ссылка. Внутренняя ссылка на карточку непублична и требует авторизации Bitrix24.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Раздел</span><span style=\"color:#52525b;\"> — Верхний уровень классификации: Клиентские, Поставщик, Логистика, Таможня, Юридические, Внутренние.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Тип документа</span><span style=\"color:#52525b;\"> — Подкатегория внутри раздела: Договор, Счёт, УПД, Инвойс и т. д.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Привязка</span><span style=\"color:#52525b;\"> — Связь документа с сущностью Bitrix24. Связь «многие-ко-многим».</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Сущность Bitrix24</span><span style=\"color:#52525b;\"> — Сделка или Компания CRM.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Контрагент</span><span style=\"color:#52525b;\"> — Компания из CRM Bitrix24, к которой относится документ. Отдельной сущности в модуле не создаётся.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">[v2] Компания-контрагент</span><span style=\"color:#52525b;\"> — Единое базовое поле со связью на штатную сущность Компания Bitrix24; отдельное обязательное поле юридического лица не используется.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Статус</span><span style=\"color:#52525b;\"> — Этап жизненного цикла документа: Черновик, На согласовании, Подписан, Активен и др.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Жизненный цикл (lifecycle)</span><span style=\"color:#52525b;\"> — Набор статусов и допустимых переходов между ними для типа документа.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Роль</span><span style=\"color:#52525b;\"> — Функциональная группа пользователя, определяющая доступ (по отделу в Bitrix24).</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Политика роли</span><span style=\"color:#52525b;\"> — Правила видимости разделов, типов и полей и права на действия для роли.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Сохранённый вид</span><span style=\"color:#52525b;\"> — Именованный набор фильтров и колонок (личный или общий).</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Placement</span><span style=\"color:#52525b;\"> — Точка встраивания интерфейса модуля в карточку Bitrix24.</span></div><div style=\"border:1px solid #ededed; border-radius:9px; padding:11px 13px; font-size:12.5px; line-height:1.5;\"><span style=\"font-weight:600; color:#4f46e5;\">Soft-delete</span><span style=\"color:#52525b;\"> — Мягкое удаление: запись скрывается из работы, но физически сохраняется.</span></div>\n        </div>\n      </div>\n      <!-- 3 goals -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">3 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Предпосылки и цели</h2>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 10px; margin-top:4px;\">Текущая ситуация (как есть) и её проблемы</h3>\n        <div style=\"display:flex; flex-direction:column; gap:6px; margin-bottom:8px;\">\n          <div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Документы хранятся разрозненно: почта, мессенджеры, локальные диски, бумага.</span></div><div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Нет единого места — теряются версии, появляются дубли, путаница в актуальности.</span></div><div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Невозможно быстро понять, какие документы есть по сделке и на каком они этапе.</span></div><div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Доступ по принципу «всё или ничего»: суммы и маржа не защищены от лишних глаз.</span></div><div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Реквизиты не структурированы — поиск возможен только по имени файла.</span></div><div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Один документ относится сразу к сделке, компании и поставке — его некуда корректно привязать.</span></div><div style=\"display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.55; color:#3f3f46;\"><span style=\"color:#dc2626; margin-top:1px;\">✕</span><span>Нет истории: кто, что и когда изменил по документу — неизвестно.</span></div>\n        </div>\n        <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 15px; margin: 22px 0 10px;\">Цели внедрения</h3>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 9px;\">\n          <div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Документы в одном месте.</b> Учёт по сделкам и компаниям-контрагентам вместо чатов, диска и почты.</div><div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Прозрачность.</b> Видно, какие документы есть, кто ответственный и на каком они этапе.</div><div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Разграничение доступа.</b> Разные роли видят разные разделы, типы и поля; финансы защищены.</div><div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Реквизиты, не только файл.</b> Номер, дата, сумма, валюта, компания-контрагент, статус — структурированно.</div><div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Множественные связи.</b> Один документ — несколько сущностей Bitrix24 одновременно.</div><div style=\"border: 1px solid #ededed; border-radius: 9px; padding: 12px 14px; font-size: 13px; line-height: 1.5;\"><b>Масштабируемость.</b> Архитектура готова к развитию без переписывания модели данных.</div>\n        </div>\n        <div style=\"margin-top: 16px; padding: 13px 15px; background: #eff4ff; border-left: 3px solid #2563eb; border-radius: 6px; font-size: 13px; line-height: 1.55; color: #1e3a5f;\"><b>Принцип интеграции.</b> Модуль расширяет Bitrix24, не заменяя его: вкладка «Документы» в карточке Сделки и в карточке Компании и отдельный полноэкранный реестр в левом меню. Сущность «Компания» остаётся штатной в CRM Bitrix24 — документ ссылается на неё по id, название денормализуется и обновляется по webhook при переименовании.</div>\n      </div>\n      <!-- 4 scope -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">4 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Границы автоматизации</h2>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n          <div style=\"border:1px solid #e2f2e8; border-radius:11px; overflow:hidden;\">\n            <div style=\"background:#f6fbf8; padding:10px 15px; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; color:#15803d;\">Входит в объём (фаза 1)</div>\n            <div style=\"padding:6px 15px 12px;\"><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Учёт карточек документов с полным набором реквизитов.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Классификация: 6 разделов и ~30 типов документов (справочники).</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Вложения: файлы на Bitrix Disk и внешние ссылки; версионирование.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Привязки к нескольким сделкам и компаниям; авто-привязка по контексту.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Ролевая модель: видимость разделов/типов/полей и права на действия.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Фильтры, поиск, сохранённые виды, экспорт XLSX.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#3f3f46; margin-top:7px;\"><span style=\"color:#15803d;\">✓</span><span>Встраивание в 3 контекста Bitrix24; история изменений документа.</span></div></div>\n          </div>\n          <div style=\"border:1px solid #ededed; border-radius:11px; overflow:hidden;\">\n            <div style=\"background:#fafafa; padding:10px 15px; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; color:#71717a;\">Не входит в объём</div>\n            <div style=\"padding:6px 15px 12px;\"><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>Юридически значимый ЭДО и подписание КЭП.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>Бухгалтерские проводки и интеграция с учётными системами.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>Генерация документов из шаблонов (кандидат на фазу 2).</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>OCR / распознавание содержимого файлов.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>Согласование через Бизнес-процессы Bitrix (BP).</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>Мобильная версия, отдельное приложение и отдельная авторизация вне Bitrix24.</span></div><div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:#52525b; margin-top:7px;\"><span style=\"color:#c4c4c8;\">—</span><span>Интеграции с внешними ЭДО (СБИС / Диадок) сверх хранения ссылок.</span></div></div>\n          </div>\n        </div>\n        <div style=\"margin-top:14px; padding:12px 14px; background:#fafafa; border:1px solid #ededed; border-radius:9px; font-size:12.5px; line-height:1.55; color:#52525b;\"><b style=\"color:#18181b;\">Допущения и ограничения.</b> Портал Bitrix24 развёрнут и обслуживается Заказчиком; компании ведутся в CRM Bitrix24; файлы хранятся на Bitrix Disk; пользователи и отделы заведены в Bitrix24. Сбой синхронизации с Bitrix не должен прерывать работу модуля.</div>\n      </div>\n      <!-- 5 roles -->\n      <div style=\"background: #fff; border: 1px solid #ededed; border-radius: 12px; padding: 32px 44px;\">\n        <div style=\"font-family: 'IBM Plex Mono'; font-size: 11.5px; color: #4f46e5; letter-spacing: 1px;\">5 · БИЗНЕС-УРОВЕНЬ</div>\n        <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 6px 0 16px; letter-spacing: -.5px;\">Роли и доступ</h2>\n        <p style=\"font-size: 14px; line-height: 1.65; color: #3f3f46; margin: 0 0 14px;\">Роль определяется по отделу пользователя в Bitrix24 (маппинг настраивается администратором). Разграничение — по разделам, типам и финансовым полям, плюс права на действия.</p>\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 12.5px;\">\n          <thead><tr style=\"background: #fafafa; text-align: left;\"><th style=\"padding: 9px 11px; font-weight: 600; border-bottom: 1px solid #ededed;\">Роль</th><th style=\"padding: 9px 11px; font-weight: 600; border-bottom: 1px solid #ededed;\">Видит разделы</th><th style=\"padding: 9px 11px; font-weight: 600; border-bottom: 1px solid #ededed;\">Суммы</th><th style=\"padding: 9px 11px; font-weight: 600; border-bottom: 1px solid #ededed;\">Ключевые права</th></tr></thead>\n          <tbody style=\"vertical-align: top;\">\n            <tr><td style=\"padding: 9px 11px; border-bottom: 1px solid #f4f4f5; font-weight: 600;\">Менеджер продаж</td><td style=\"padding: 9px 11px; border-bottom: 1px solid #f4f4f5;\">Клиентские, внутренние</td><td style=\"padding: 9px 11px; border-bottom: 1px solid #f4f4f5; color: #dc2626;\">скрыты</td><td style=\"padding: 9px 11px; border-bottom: 1px soli
