name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://registry:registry@127.0.0.1:5432/registry
      TEST_DATABASE_URL: postgresql://registry:registry@127.0.0.1:5432/registry
      SEED_PORTAL_URL: https://thermech.bitrix24.ru

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate -w backend

      - name: Seed verification database
        run: npm run db:seed -w backend

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production bundles
        run: npm run build

  verifyExpected:
    name: verifyExpected
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require successful verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "verify finished with result: $VERIFY_RESULT"
            exit 1
          fi
